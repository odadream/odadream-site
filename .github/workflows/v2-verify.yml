name: V2 verify (no deployment)
on:
  push:
    branches: [codex/site-v2]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oda-v2-check-results
          path: |
            .local-server/checks/*/report.json
            .local-server/checks/*/*.log
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: oda-v2-static-preview
          path: dist/
          retention-days: 14
