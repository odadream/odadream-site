name: Deploy and Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Проверяем версию
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check version change
        id: version
        run: |
          VERSION=$(node -p "require('./versions.json').current")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

          # Проверяем изменился ли versions.json в последнем коммите
          if git diff HEAD^ HEAD --name-only | grep -q "versions.json"; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ versions.json changed, will create release"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️  versions.json not changed, skipping release"
          fi

  # Deploy всегда
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache node_modules
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Release только если версия изменилась
  create-release:
    needs: [check-version, build-and-deploy]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check if tag exists
        id: tag-check
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${{ needs.check-version.outputs.tag }}"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️  Tag already exists, skipping"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Creating new release"
          fi

      - name: Generate release notes with wiki-link conversion
        if: steps.tag-check.outputs.exists == 'false'
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const versions = require('./versions.json');
          const latest = versions.history[0];
          const baseUrl = 'https://odadream.art';

          /**
           * Конвертирует wiki-style ссылки в markdown ссылки
           * 
           * Форматы:
           *   [[lectures]] → [Lectures](https://odadream.art/?id=lectures)
           *   [[lectures|Лекции]] → [Лекции](https://odadream.art/?id=lectures)
           *   [[neurobattle|MindBattle Protocol]] → [MindBattle Protocol](https://odadream.art/?id=neurobattle)
           * 
           * @param {string} text - Текст с wiki-ссылками
           * @param {string} baseUrl - Базовый URL сайта
           * @returns {string} Текст с markdown ссылками
           */
          function convertWikiLinks(text, baseUrl) {
            if (!text) return text;
            
            // [[link|custom text]] → [custom text](url?id=link)
            text = text.replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, (match, id, title) => {
              const cleanId = id.trim();
              const cleanTitle = title.trim();
              return `[${cleanTitle}](${baseUrl}/?id=${cleanId})`;
            });
            
            // [[link]] → [Link](url?id=link) (первая буква заглавная)
            text = text.replace(/\[\[([^\]]+)\]\]/g, (match, id) => {
              const cleanId = id.trim();
              const title = cleanId.charAt(0).toUpperCase() + cleanId.slice(1);
              return `[${title}](${baseUrl}/?id=${cleanId})`;
            });
            
            return text;
          }

          // Конвертируем описания
          const descEn = convertWikiLinks(latest.desc_en, baseUrl);
          const descRu = convertWikiLinks(latest.desc_ru, baseUrl);

          // Формируем красивые release notes
          const notes = `## 🎯 ${latest.title_en} / ${latest.title_ru}

          ### English
          ${descEn}

          ### Русский  
          ${descRu} 

          **🌐 Live:** [odadream.art](${baseUrl}/)
          `;

          fs.writeFileSync('release_notes.md', notes);
          console.log('✅ Release notes generated');
          console.log('   📝 Wiki-links converted:', {
            found: (latest.desc_en + latest.desc_ru).match(/\[\[/g)?.length || 0
          });
          SCRIPT

      - name: Create Release
        if: steps.tag-check.outputs.exists == 'false'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.check-version.outputs.tag }}
          name: "${{ needs.check-version.outputs.version }}"
          bodyFile: release_notes.md
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
