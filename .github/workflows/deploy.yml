name: Deploy approved V2 to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recheck_run:
        description: 'Prior full release run: reuse passed checks only when production sources are unchanged'
        required: false
        default: ''
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Public browser identifiers for the isolated, validated V2 providers.
    # V1 VITE_* repository variables remain available for an archived rollback.
    env:
      PUBLIC_ANALYTICS_ENABLED: 'true'
      PUBLIC_ANALYTICS_DEBUG: 'false'
      PUBLIC_GA_MEASUREMENT_ID: 'G-5LXP60T8R0'
      PUBLIC_YANDEX_METRICA_ID: '113596895'
      PUBLIC_ANALYTICS_AUTO_EVENTS_DISABLED: 'true'
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
          ODA_RECHECK_RUN: ${{ inputs.recheck_run }}
        run: |
          if [ -n "$ODA_RECHECK_RUN" ]; then
            node scripts/recheck-release.mjs
          else
            npm run verify:release
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oda-v2-release-check-results
          path: |
            .local-server/checks/*/report.json
            .local-server/checks/*/*.log
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v4
