    depends_on: [ HERO-01 ]
    notes: "Есть агрегированный baseline на 2026-08-30: 150 сессий, 1 751 тейк, 1 348 видео с измеренной суммарной длительностью около 69,8 часа. В hero показаны 1 751 запись и округлённые 70 ч. с датой выгрузки; исходные 69,8 ч. сохранены в данных. Снимок publication/privacyReview=review защищён release gate. Ритмы не классифицированы; публичный выпуск требует согласия, privacy review и утверждённой методики. Блокирующее условие: подтверждённое разрешение публикации агрегата и методика/согласия источника. Эта внешняя статистика исключена из необходимого объёма миграции."

