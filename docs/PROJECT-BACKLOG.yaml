    notes: "Hero — полноэкранный видеокадр с эпиграфом и конкретным предложением о студии; компактная этикетка и датированный агрегат вторичны. На мобильном агрегат расположен под видео. Читаемость вступления обеспечивает градиент в полноразмерном слое без видимого края плашки. VIDEO-PREVIEW-01 завершён: воспроизведение по наведению/центру, переключение кадров ручное. Задача относится к дальнейшему отбору/уточнению hero, не к незавершённому клиентскому механизму."
    progress: "Пять источников скопированы в локальные короткие MP4-превью с постерами. Заголовки и детали берутся из записей медиа/работ; MindShow ведёт на страницу работы, но не на BYOB-кейс, пока источник этого конкретного ролика не подтверждён. Сохранено пять HeroVisual, на главной показаны четыре; прототип Предков исключён. Терраформинг и Культурный код связаны с Method:neuromandala без выдуманной работы/кейса; выбранные Media имеют права cleared по разрешению владельца от 2026-10-05. Шестой MOV не найден."

