schema_version: 1
updated: 2026-10-06
maintainer: ODA.dream site team
status_values: [planned, in_progress, blocked, done]
priority_values: [P0, P1, P2]
items:
  - id: LEGACY-WORK-RESOURCES-01
    title: Сохранить дополнительные оригиналы выбранных работ по историческим URL
    area: migration
    priority: P0
    status: done
    outcome: Ещё 15 оригинальных изображений связаны с Work как архивные ресурсы; 28 исторических файлов выбранного пакета проверены HTTP 200 и SHA-256.
    acceptance:
      - Разные кадры истории не становятся aliases одной обложки или новыми Work; сцены и документы третьих лиц не получают автоматических разрешений.
      - Каждый ресурс имеет Work, собственные rights, основание и точный исторический путь; данные источника и хеши не экспортируются.
      - Review Work, restricted resource и опасный путь не создают публичного файла; обычная сборка удаляет отложенные ресурсы.
      - Файл и запись preserve совпадают с исходным SHA-256; старые картинки проверены через реальный HTTP в preview и частном candidate fixture.
    notes: 11 оригиналов истории колец и 4 превью других выбранных Work. Полный M4 ещё не закрыт; 12 сторонних писем, фото Сбера и ASSET-заглушка остаются отдельными решениями. Веса прогресса не меняются.

  - id: MIGRATION-QA-01
    title: Проверить весь выбранный пакет в изолированной публичной проекции
    area: migration
    priority: P0
    status: done
    outcome: Тестовая копия собирает 44 страницы RU/EN с 9 Work, 7 событиями и 2 PDF; проверены 846 ссылок и 60 сценариев геометрии.
    acceptance:
      - Статусы publication симулируются только в игнорируемой тестовой копии; права и рабочие данные не изменяются.
      - Используются настоящие публичные маршруты, зависимости и verify-build; внутренние локаторы и стенд не экспортируются.
      - Ссылки и якоря разрешаются внутри пакета; файлы существуют, мобильная и настольная геометрия проверена в обеих темах.
      - Результат обозначен как fixture и не является артефактом для публикации; обычная сборка проверяется отдельно.
    notes: npm run migration:qa воспроизводит проверку и обновляет текущий результат в существующем inventory. Подробная редактура и разрешения не симулируются в рабочих данных.

  - id: MIGRATION-PERFORMANCE-01
    title: Измерить производительность выбранного содержательного пакета
    area: migration
    priority: P0
    status: done
    outcome: Сохранены три лабораторных Lighthouse-замера содержательного пакета, а не пустой review-сборки.
    acceptance:
      - Проверены мобильная и настольная главная и мобильная страница работы с PDF; отчёты воспроизводимы через migration:qa.
      - FCP, LCP, CLS, TBT и нерешённые аудиты сохранены в inventory; оценка не подменяет полевой INP.
      - Недостатки первого изображения и условия тестового HTTP-сервера отделены от доставки реальных счётчиков и разрешения выпуска.
    notes: Главная mobile 84/100, desktop 99/100, кольца mobile 98/100. Accessibility, best practices и SEO по 100 в этих трёх замерах. Медианы трёх запусков каждого сценария. Это baseline; оптимизация вынесена в ENGINE-PERFORMANCE-01.

  - id: ENGINE-PERFORMANCE-01
    title: Ускорить первое изображение главной и адаптивную доставку медиа
    area: engine
    priority: P1
    status: planned
    outcome: После миграции сравнить повторные замеры с baseline и сократить мобильный LCP без потери материала.
    acceptance:
      - Проверены приоритет загрузки первого материала, размеры и варианты изображений; до и после измерен тот же пакет.
      - Кеш и сжатие проверены на целевом хостинге, а не выводятся из простого локального HTTP-сервера.
    notes: Lighthouse baseline mobile home LCP 4374 ms, desktop 842 ms, mobile rings 2333 ms; CLS ниже 0.001, TBT 0. Не включено в процент переноса, относится к отдельному проходу движка.

  - id: LEGACY-OUTBOUND-01
    title: Проверить внешние и QR-входы архивного пакета
    area: migration
    priority: P0
    status: in_progress
    outcome: Значимые пути из PDF, досье и отправленных материалов имеют установленное назначение и границу достоверности.
    acceptance:
      - Ссылки-аннотации отличены от QR и напечатанных адресов; контакты не дублируются в публичных новых CTA без основания.
      - Недоступные материалы и неизвестные отправленные версии учтены явно, запрос внешнего адреса не выдаётся за подтверждение его содержания.
    notes: Все 55 страниц 11 PDF автоматически просмотрены при 144 dpi; два QR баннера колец декодированы как исторические личные Telegram/WhatsApp-контакты. Дополнительно по указанию владельца найдены четыре PDF-кандидата в источниках GDB (29 страниц, 48 ссылок); связь с отправками Divent/N:OW не установлена. Контактные payload не сохранены; отсутствие других обнаружений не доказывает отсутствия QR. Входит в M4 без удаления исходников и остаётся in_progress.

  - id: ANALYTICS-CORE-01
    title: Подготовить события и согласие для статического V2
    area: analytics
    priority: P0
    status: done
    outcome: Общий runtime измеряет просмотры, контактное намерение, документы и медиа; предпросмотр диагностируется локально без внешних счётчиков.
    acceptance:
      - События используют whitelist канонического пути, языка и стабильных Work/Format/Case/Material/Media ID; email, текст ссылки и query не передаются.
      - Root id-bridge не создаёт просмотр; page_view не повторяется при повторном согласии или вызове API.
      - До согласия счётчики не загружаются, отзыв во время загрузки отменяет инициализацию и отложенные действия.
      - Debug в dev остаётся локальным, реальная отправка требует валидной конфигурации и опубликованного режима.
      - Отказ счётчика не ломает контакты; общий RU/EN компонент согласия показан в дизайн-системе.
    notes: Публичные ID перенесены из старой .env.local в игнорируемую локальную конфигурацию V2; отправка остаётся выключенной. Реальное наблюдение в GA4/Метрике и настройка автоматических событий остаются ANALYTICS-MIGRATION-01.

  - id: RESOURCE-REFERENCES-01
    title: Разделить оставшиеся ресурсы по связи с выбранным содержанием
    area: migration
    priority: P0
    status: done
    outcome: 550 ресурсов получили точные прямые ассоциации со старым Markdown; группы помогают отбору без автоматического удаления.
    acceptance:
      - Совпадение пути точное; thumbnail с общим префиксом не подменяет исходную картинку, query не меняет идентичность файла.
      - Подготовленная зависимость требует точной физической копии; совпадение в источнике не означает права или входной трафик.
      - Сохраняются 198 содержательных решений M4; аудит не снимает release gate.
  - id: NAVIGATION-COVERAGE-01
    title: Включить все обзорные разделы в основное меню
    area: design
    priority: P0
    status: done
    outcome: Меню RU/EN читается из реестра страниц и включает M / Нейромандала и R / Признания.
    acceptance:
      - Все девять обзорных маршрутов представлены один раз; D доступен только в dev.
      - Подробная работа выделяет W, кейс K; стенд выделяет только D.
      - Проверены 390/601/797/1440/1600/1601/1920 px; короткое меню прокручивается и закрывается Escape с возвратом фокуса.
      - Образец меню в дизайн-системе использует тот же реестр, футер остаётся служебным.

  - id: LEGACY-DOCUMENTS-CORE-01
    title: Проверить архивные PDF и связать документы выбранной работы
    area: migration
    priority: P0
    status: done
    outcome: Все 11 PDF разобраны на 55 страницах; два оригинала колец связаны с Work и сохраняют исторические URL.
    acceptance:
      - Существующий inventory содержит хеши, страницы, ссылки-аннотации и прямые источники PDF; внешние цели не объявляются проверенными без запроса.
      - Чертёж и баннер колец имеют собственные права и историческое пояснение; metadata не экспортирует внутренние хеши/источники.
      - DocumentList использует общий list-row на странице и стенде; размер PDF виден до открытия, автозагрузки нет.
      - Старые ID ведут к точным якорям документов; review Work или restricted document не создают публичного ресурса.
    depends_on: [MEDIA-AUDIT-FULL-01, PUBLICATION-SCOPE-01]
  - id: MEDIA-AUDIT-FULL-01
    title: Проверять все старые ресурсы и физическое сохранение URL
    area: migration
    priority: P0
    status: done
    outcome: Полный аудит 550 ресурсов разделяет редакционную копию, разрешённый публичный путь и физическое наличие файла.
    acceptance:
      - Обход включает PDF, M4V и остальные каталоги; каждая строка имеет SHA-256 и размер.
      - Процедурный SVG Lotus отличён от содержательной векторной работы; служебные файлы учитываются отдельно.
      - Release gate не считает несуществующий разрешённый файл сохранённым; локальная копия не снимает review.
      - Решения retire/redirect не создаются автоматически; расширение аудита не завершает M4.
    notes: 550 ресурсов, 349 процедурных узлов, 3 служебных файла, 198 содержательных URL требуют решений. Подробности остаются в существующих media-audit и inventory.
  - id: HISTORY-MIGRATION-CORE-01
    title: Перенести выбранную историю и роли в конкретных событиях
    area: content
    priority: P0
    status: done
    outcome: Четыре подробных кейса и три кратких контекста связаны с Work/Method и имеют точность дат, роли и источники.
    acceptance:
      - Портал, Дикая Мята и ЦИПР сохранены краткими строками; нет новых страниц-заглушек.
      - Дата-заглушка не становится точным днём; неизвестная площадка не выдумывается.
      - Роль заказчика, организатора, площадки и участника относится к конкретному событию.
      - Каталог и статистика считают те же семь событий; главная сохраняет четыре выбранные вехи.
  - id: EVIDENCE-MIGRATION-CORE-01
    title: Уточнить выбранные подтверждения и пределы утверждений
    area: evidence
    priority: P0
    status: done
    outcome: Четыре событийных основания и пять документов имеют конкретное утверждение, адресата/контекст, источники и ограничения.
    acceptance:
      - Четыре доступных изображения сверены и закреплены SHA-256; МФТИ остаётся явно отсутствующим сканом.
      - Первое место Портала отличается от диплома участия в панели; письма не превращаются в постоянное партнёрство.
      - Цитирование отзыва ЦИПР не разрешено автоматически; права документов и редакционная публикация остаются отдельными gate.
      - Внутренние пути и хеши не отображаются в публичном представлении.
  - id: EVIDENCE-EDITORIAL-REVIEW-01
    title: Уточнить точные даты, площадку Портала, скан МФТИ и права документов
    area: evidence
    priority: P1
    status: planned
    outcome: Финальный редакционный проход снимает явно сохранённые неизвестные значения и устанавливает разрешённый публичный состав.
    notes: Портал — конфликт Сколково/Кинозавод Москино; краткие события имеют только год. Скан МФТИ отсутствует. DocumentRights review не заменяется фактом чтения скана. Не блокирует перенос структуры и выбранных смыслов.
  - id: WORKS-MIGRATION-CORE-01
    title: Перенести рассказы и авторские роли девяти выбранных работ
    area: content
    priority: P0
    status: done
    outcome: Девять канонических Work имеют самостоятельный рассказ, авторство, доступность, связи и подтверждённые источники в RU/EN.
    acceptance:
      - Рассказ хранится в данных; общий шаблон показывает историю, устройство, роли и контакт без локальных веток по ID.
      - Исторические алиасы не размножают работы; Эмомандала OS остаётся элементом составной работы.
      - Концепт Круга и прототип Предков сохраняют решения владельца; архивные предложения производства не становятся текущей доступностью.
      - Источники зафиксированы SHA-256; права и редакционное одобрение не выводятся из завершения переноса.
    notes: 27 смысловых разделов, 18 локализованных страниц; расширение корпуса из WORKS-01 остаётся отдельной очередью.
  - id: STUDIO-MIGRATION-01
    title: Перенести биографии, позицию и материалы студии
    area: content
    priority: P0
    status: done
    outcome: Studio содержит биографии обоих основателей, позицию и этику, три образовательных контекста и четыре доступных HTML-материала.
    acceptance:
      - Биографии используют отдельные Person; контексты описывают роль приглашения с точностью до года.
      - Нет автоматического переноса регалий, CV-счётчиков, грантовых обещаний или бессрочных партнёрств.
      - Материалы ведут к действующим страницам; фиктивных загрузок или чужого архивного PDF вместо актуального dossier нет.
      - Модуль и биографии входят в общий публикационный gate; внутренние источники не попадают в публичную проекцию.
    notes: Publication остаётся review; архивные PDF и выбранные подтверждения относятся к оставшимся M3/M4.
  - id: DESIGN-CONTENT-LAYOUT-01
    title: Согласовать строки содержания, списки и заполнение паспортов
    area: design_system
    priority: P1
    status: done
    outcome: Общие стили исправляют сжатые рассказы, пустые колонки паспортов и сброс интервала перед списками.
    acceptance:
      - Метка привязана к первой строке заголовка; на телефоне следует перед материалом.
      - Единственный блок рассказа занимает колонку материала; реквизиты и действие используют отдельные колонки только при наличии.
      - Фактические поля паспорта заполняют каждую строку, включая неполную последнюю и поля слота.
      - Списки соблюдают общий вертикальный ритм; переносы пунктов идут по текстовой оси.
      - Правила описаны в DESIGN-GUIDE и показаны общими стилями в разделах 03 и 11 стенда.
    notes: Проверка включает 360/797/908/1100/1201/1529 px, обе темы, RU/EN и отсутствие overflow; полное меню теперь сворачивается до 1600 px включительно (NAVIGATION-COVERAGE-01). Миграционные checkpoint не изменяются.
  - id: DESIGN-LINKS-01
    title: Единая CAD-выноска текстовых ссылок
    area: design_system
    priority: P1
    status: done
    outcome: CalloutLink объединяет подчёркивание каждой строки с диагональю последней строки без разрыва.
    acceptance:
      - Hero, карточки, списки, паспорта и стенд используют общий компонент и токены; хедер и футер используют простые ссылки.
      - Один пробел перед диагональю включён в полку; последнее слово и стрелка переносятся вместе.
      - Проверены RU/EN, обе темы, короткие и многострочные ссылки на мобильной и настольной ширине.
    notes: Astro check и сборка проходят; четыре целевых Playwright-проверки проходят, включая ширины 360/797/1529.
  - id: HOME-01
    title: Собрать главную как краткий обзор деятельности студии
    area: information_architecture
    priority: P0
    status: in_progress
    outcome: Каждый обзорный блок ведёт к полному разделу; главная не дублирует внутренние страницы.
    acceptance:
      - Hero ведёт к странице технологии и метода Нейромандалы.
      - Избранные работы ведут в полный каталог работ; отдельная одиночная избранная работа отсутствует.
      - Карточки имеют общий шаблон: медиа, категория, типизированный статус, название, краткий текст; последовательные коды контентных элементов отсутствуют.
      - Главная показывает выбранные признания из старого публичного архива и ведёт в полный архив; найденные сканы имеют превью, публикация остаётся за правовым gate.
      - Счётчики работ, кейсов и признаний вычисляются из тех же записей, что и списки.
      - Краткий метод расположен после работ и ведёт к подробному объяснению медиума.
      - Избранная хронология ведёт к полному архиву событий.
      - Признания и контакт имеют явные маршруты углубления.
    depends_on: [HERO-01, WORKS-01, METHOD-01, HISTORY-01, RECOG-01]

  - id: HERO-01
    title: Создать страницу базовой технологии Нейромандалы и hero-карусель
    area: media_and_content
    priority: P0
    status: in_progress
    outcome: Hero показывает несколько форм Нейромандалы и объясняет технологическое/художественное ядро.
    acceptance:
      - Шесть перечисленных владельцем исходников имеют проверенные подписи, даты, авторство и права.
      - HeroVisual не хранит копии названия/подзаголовка: карточка получает редакционные поля из Work, а доказанный контекст — из CaseEvent. `unmapped` не выпускается.
      - Каждый опубликованный кадр ведёт к канонической Work или Method; CaseEvent указывается только по проверенному контексту.
      - Перемешивание меняет порядок на новую сессию, но не сбрасывается при каждом рендере слайда.
      - Только активный ролик загружается и воспроизводится; есть постер, ручные элементы управления и понятная подпись.
      - Для reduced-motion, экономии трафика и мобильного соединения доступен постер без автопроигрывания.
      - Минутный исходник «Частоты» получает отдельный короткий веб-фрагмент с подтверждённой точкой обрезки.
    notes: Hero — полноэкранный видеокадр с эпиграфом и конкретным предложением о студии; компактная этикетка и датированный агрегат вторичны. На мобильном агрегат расположен под видео. Читаемость вступления обеспечивает градиент в полноразмерном слое без видимого края плашки.
    progress: "Пять источников скопированы в локальные короткие MP4-превью с постерами. Заголовки и детали берутся из записей медиа/работ; MindShow ведёт на страницу работы, но не на BYOB-кейс, пока источник этого конкретного ролика не подтверждён. Сохранено пять HeroVisual, на главной показаны четыре; прототип Предков исключён. Терраформинг и Культурный код связаны с Method:neuromandala без выдуманной работы/кейса; выбранные Media имеют права cleared по разрешению владельца от 2026-10-05. Шестой MOV не найден."

