      - Все отобранные доступные источники hero имеют проверенные подписи, происхождение и права; отсутствующий шестой источник учтён отдельно и не блокирует остальной перенос.
      - "HeroVisual не хранит копии названия/подзаголовка: карточка получает редакционные поля из Work, а доказанный контекст — из CaseEvent. `unmapped` не выпускается."
