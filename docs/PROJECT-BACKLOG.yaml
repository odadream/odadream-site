    depends_on: [MIGRATION-PLAN-01]
    notes: '2026-10-10: владелец разрешил изолированную настройку и предоставил входы. Созданы отдельные GA4 properties/558352762 (G-5LXP60T8R0) и Метрика 113596895; V1 не изменена. В кабинетах/API проверено отключение enhanced measurement/автоцелей, созданы общие dimensions и 8 целей. Все 9 контрактных событий получены живыми API обоих провайдеров после действий на тестовой production-сборке; ноль запросов до согласия, сбор останавливается после отзыва. Исправлена потеря событий при разной скорости загрузки SDK; регрессия и 129 E2E прошли. Токены сохранены вне репозитория/YandexDisk, исходные readonly grants Hub сохранены; default V2 disabled. Доказательства: inventory.currentAnalyticsValidation.'

