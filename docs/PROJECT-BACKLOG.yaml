items:
  - id: RELEASE-GHPAGES-01
    title: Подготовить проверенную замену V1 на V2 в основном checkout и GitHub Pages
    area: maintenance
    priority: P0
    status: in_progress
    progress: Локальная подготовка 13.10.2026 проверена. Release 1237.01 с — 111 unit,
      176 browser passed / 34 skipped; production analytics и release gate прошли.
      Отчёт — .local-server/checks/1791894227804; snapshot SHA — 9fece8bb0fc6208e1345b049847ca56decc8191c50bc9639ee6a57d8fef30858.
      Проверены CRC пяти архивных ZIP, свежие V1/V2 snapshots и полный bundle 26 Git refs;
      квитанции — .local-server/prepublication-feedback. Providers V2 подготовлены для odadream.art,
      действующие providers V1 сохранены. Linux CI на bca90df прошла — 111 unit,
      176 browser passed / 34 skipped, 715.38 с; https://github.com/odadream/odadream-site/actions/runs/38405865064.
      Исправлены fixture имени checkout, потеря ввода при image-load/resize в DEV-crop и ожидание CSS в reading matrix.
      Независимый restore в папку odadream-site прошёл npm ci/types/content/production build;
      CSS и содержимое артефакта эквивалентны после проверенного переименования единственного CSS entry.
      фактические перенос, переключение Hub, Pages и контроль на домене пока не выполнены.
    outcome: История и текущие файлы V1 сохранены; V2 получает основную папку, проверенную сборку и свои аналитику/SEO.
    acceptance:
      - Архивные public/internal V1 различены; свежие снимки V1/V2 и всех refs проверены независимо.
      - Перенос сохраняет общую .git и остальные worktree, незакоммиченные и необходимые ignored-файлы не теряются.
      - Production workflow собирает V2 с проверенными новыми GA4/Метрикой; старые VITE variables не используются V2.
      - Действующий sitemap.xml выдаёт актуальную карту V2; Hub получает отдельные sources новых providers с сохранением истории V1.
      - Release на актуальном head проходит локально и в Linux CI; опубликован тот же проверенный артефакт.
      - После прямого решения о выпуске основной checkout и origin/main содержат V2; Pages, SEO и consent проверены на домене.
      - Порядок восстановления не требует force-push; опубликованные SHA и URL проверок записаны.
    source: Запрос владельца 13.10.2026 о проверке готовности и сценарии замены сайта.
    depends_on: [ MIGRATION-COMPLETE-01, ANALYTICS-MIGRATION-01, PREPUBLICATION-HOME-EVENTS-03 ]
    reading: [ docs/RELEASE-RUNBOOK.md ]

  - id: PREPUBLICATION-HOME-EVENTS-03
    title: Уплотнить события и поля паспортов, выровнять навигационную цепочку
    area: design
    priority: P0
    status: done
    progress: Закрыто 13.10.2026. Full 1337.45 с — 110 unit и 175 browser passed, 33 skipped;
      данные, типизация, сборка и SHA установленного dist проверены.
      Отдельный регрессионный прогон — 18 passed / 4 skipped. Отчёты — .local-server/checks/1791880377536
      и 1791880174622; визуальные снимки — .local-server/prepublication-feedback.
    outcome: Каждая обзорная карточка имеет одну ссылку в названии; подборка управляется полями реестра.
      Область нажатия заголовков и действий в паспортах сохраняется независимо от высоты текстовой строки.
    acceptance:
      - Главная показывает только отмеченные held-события в обратной хронологии; автоматическое покрытие каждого года убрано.
      - Удалены Подробнее и отдельные ссылки на работы из overview; они доступны внутри описаний событий.
      - Десять событий выбраны по отзыву 13.10; Гастро.Юг 13–19.07.2025 не смешивается с отклонённой заявкой Таврида ИИ.
      - Удалена публичная надпись про единицу подсчёта; корректная дедупликация статистики сохранена.
      - Breadcrumbs используют общую текстовую базовую линию с сохранённой областью касания; проверены desktop/mobile и RU/EN.
      - Короткие и многострочные названия имеют одинаковый интервал до места; область нажатия не задаёт высоту текста.
      - Ссылки и кнопка копирования в паспортах и выходных данных не добавляют пустую строку и не растягивают соседние ячейки.
    source: Отзыв владельца 13.10.2026; карточка Obsidian Таврида.Арт Гастро.Юг 2025.

  - id: MAINT-CHECKS-01
    title: Разделить проверки на quick, full и release с единым запуском
    area: maintenance
    priority: P0
    status: done
    progress: Закрыто 13.10.2026. Единый quick/full/release/browser работает локально и в CI;
      shared/unknown расширяются до full, свежая сборка изолирована на прогон, проверенная копия dist
      совпадает по SHA. Release 934.18 с, 107 unit и 171 browser passed/33 skipped; WorkCard quick
      111.35 с, 10 browser passed/4 skipped при сохранении языков, тем, ширин и профилей.
      Цель 90 с пока превышена на 21.35 с; общие unit/types занимают около 31 с, остаются обходы/копирование
      полного пакета. Ускорение загрузчика и fixtures относится к MAINT-LOADER-01/MAINT-VALIDATION-01,
      это не основание сокращать full. Логи и SHA — .local-server/checks/1791840792266 и 1791841896521.
    outcome: Локальные изменения проверяются по риску; полная приёмка и выпуск используют свежий проверенный артефакт.
    acceptance:
      - Предложение и измеренная база — MAINTENANCE-AUDIT.md, находки 1 и 8; правила AGENTS меняются вместе с runner.
      - Общие токены, маршруты, разрешения и неизвестные зависимости расширяют охват; полный набор сохранён.
      - PUBLIC строится до проверки, отчёт указывает commit/runtime/режим; неподтверждённый старый dist не считается актуальным.
      - Целевой quick до 90 секунд подтверждён замером или отклонение объяснено; повышение workers только после изоляции ресурсов.
    source: docs/MAINTENANCE-AUDIT.md

  - id: MAINT-CONTEXT-01
    title: Сократить активные инструкции и устранить дублирование документов
    area: maintenance
    priority: P0
    status: done
    progress: Закрыто 13.10.2026. README/AGENTS задают карту чтения; task-context читает задачи по ID,
      статусу/области, тексты по языку/статусу, отдельный source ID и текущие числовые срезы.
      Новый реестр не введён; metadata проверяет ID/состояния/зависимости, редакционный контракт и бюджеты
      миграции. CMS сокращён с 6183 до 5074 слов, принципы с 4266 до 3880; исторические отчёты отмечены,
      старое правило reset видео и устаревший статус SOCIAL-01 устранены. Решения/протоколы сохранены
      в Git 71c3218. Ссылки документов и исходные 100% миграции проверены. Авторская приёмка не изменена.
    outcome: У каждого правила и статуса один источник истины; архивные отчёты не становятся текущими ограничениями.
    acceptance:
      - Карта чтения и ответственности закреплена в README; найдённые противоречия исправлены без утраты решений владельца.
      - Контракты описывают действующую систему, история и подробные логи явно отделены; новый комплект дублирующих инструкций не создаётся.
      - Есть выборки по ID/статусу/области из существующих реестров; итоговые числа генерируются, не копируются вручную.
      - Карточка контекста задачи собирается из существующих источников; продолжение не требует всей переписки и не создаёт второй реестр.
      - Обычная реализация обновляет задачу и затронутый контракт, дополнительные изменения документов обоснованы.
    source: docs/MAINTENANCE-AUDIT.md, находка 3

  - id: MAINT-ENV-01
    title: Сделать локальное окружение и резервное восстановление проверяемыми
    area: maintenance
    priority: P1
    status: done
    progress: Закрыто 13.10.2026. Диагностика и изолированные сборки дополнены workspace backup/verify/restore
      и prune-checks. Независимая копия вне YandexDisk содержит bundle текущей ветки, 1530 рабочих файлов,
      env и приватные медиа/OCR-кэши (359590349 байт); восстановлены история и файлы, npm ci,
      Astro check/content/build/artifact успешны. Публичные пакеты эквивалентны; один идентичный CSS
      получил имя unavailable вместо _path_, в 107 HTML отличаются только ссылки на него.
      Общий SHA поэтому различается, необъяснённых отличий нет; строгий контроль одного проверяемого
      пакета не ослаблен. Full 971.43 с, 110 unit и 171 browser passed/33 skipped.
      Общая блокировка предотвращает пересечение проверок/backup/очистки; проверены порча копии,
      занятый restore-target, linked paths и защита незавершённых прогонов. Очистка устаревшего dist
      освободила 94341346 байт; отчёты и приватные кэши сохранены. Правила и границы — README,
      доказательства — .local-server/recovery-proof.json и checks/1791842999827/report.json.
      Исходный checkout сохранён; перенос рабочего места вне синхронизации описан без автоматического переноса.
    outcome: Диагностика объясняет runtime, серверы и свежесть PUBLIC; восстановление не зависит от синхронизатора.
    acceptance:
      - Проверяются корень V2, Node, зависимости, идентичность/порты серверов и актуальность PUBLIC без вывода секретов; E2E не принимает другой сайт на том же порту.
      - Терминал, ярлык и CI используют совместимые явно указанные runtime.
      - Проверена резервная копия и описан возможный checkout вне синхронизации; исходный checkout и локальные кэши не удаляются автоматически.
    source: docs/MAINTENANCE-AUDIT.md, находка 9

  - id: MAINT-LOADER-01
    title: Заменить вложенные data URL в загрузчике инструментальных TS-модулей
    area: maintenance
    priority: P1
    status: planned
    outcome: Общие данные загружаются без многократного встраивания зависимостей в строки импортов.
    acceptance:
      - Выбор ESM-кэша или TS-runner подтверждён сравнительным пилотом на одном commit/runtime, минимум три замера.
      - Кэш инвалидируется исходниками и настройками; ошибки содержат пути, результаты DEV/PUBLIC совпадают с текущим контрактом.
      - Частные данные не попадают в публичные артефакты; Node native TS не принимается без проверки импортов и import.meta.env.
    depends_on: [ MAINT-CHECKS-01, MAINT-ENV-01 ]
    source: docs/MAINTENANCE-AUDIT.md, находка 2

  - id: MAINT-VALIDATION-01
    title: Разделить текущую валидацию, архивный контроль и браузерные fixtures
    area: maintenance
    priority: P1
    status: planned
    outcome: Проверки находят реальные нарушения контракта без обязательной ручной правки текущих счётчиков.
    note: При проверке восстановления обнаружены абсолютные cacheDirectory/searchText в приватных индексах
      и OCR-манифестах. Файлы сохраняются резервированием, сборка от них не зависит; перенос подготовительного
      окружения требует перепривязки путей. Повтор media:prepare может переиспользовать старый OCR-манифест.
    acceptance:
      - Schema, relations, publication, prepared-assets и provenance вызываются явными наборами; разрешения и источник опубликованного материала продолжают проверяться.
      - Исторический inventory сохраняется; текущий индекс при необходимости генерируется, не редактируется параллельно.
      - Живые счётчики заменены проверкой охвата и независимыми обязательными примерами; исторические фиксированные снимки различимы.
      - Редакторская проверка/приёмка привязана к отпечатку редакции; изменение текста показывает необходимость повторной проверки, решения владельца сохраняются.
      - Общий viewport/resize helper и изолированные серверы сохраняют геометрические и privacy-проверки.
    depends_on: [ MAINT-CHECKS-01, MAINT-LOADER-01 ]
    source: docs/MAINTENANCE-AUDIT.md, находки 6 и 8

  - id: MAINT-VIEWS-01
    title: Разделить представления страниц и стили по семействам компонентов
    area: maintenance
    priority: P1
    status: planned
    outcome: Изменение одной страницы не требует правки общего большого шаблона и глобального каскада.
    acceptance:
      - Начальный overview/detail пилот оставляет URL, якоря, порядок чтения и общие компоненты неизменными.
      - PageView становится диспетчером; выделение BaseLayout и CSS выполняется по ответственности без дробления каждого текста.
      - Перенос файлов отделён от изменения дизайна, каскад/токены и RU/EN mobile/desktop обеих тем проверены.
    depends_on: [ MAINT-CHECKS-01, MAINT-CONTEXT-01, MAINT-VALIDATION-01 ]
    source: docs/MAINTENANCE-AUDIT.md, находки 4 и 7

  - id: COURSE-REVISION-01
    title: Закрепить расширенный курс и очередь источников без новых документов
    area: migration
    priority: P0
    status: done
    outcome: Короткий план, принципы, бэклог и inventory описывают одну новую границу.
    acceptance:
      - План заменён компактной актуальной редакцией; полная история доступна в Git 3486e44.
      - Все 238 исходных ID получили scopeRebase с применением/пакетом; это учёт назначения источника, не утверждение выполненного переноса.
      - Статусы старых done сохранены; 95% заморожены как отдельная предыдущая база, новая сумма весов равна 100.
    source: Решения владельца 2026-10-07 и docs/MIGRATION-PLAN.md
  - id: RESOURCE-REBASE-01
    title: Вернуть прежние предложения исключения ресурсов на предметный пересмотр
    area: migration
    priority: P0
    status: done
    outcome: 170 неподтверждённых retire не применяются к новому расширенному объёму.
    acceptance:
      - 28 preserve и точные SHA остаются; 170 неутверждённых предложений отмечены review/pending-reassessment.
      - Старое основание и версия доступны в Git; никакой новый 404, redirect или разрешение не объявлены.
      - 39 дополнительных медиа выбранных работ, исторические кадры и содержательные ресурсы остальных работ вернулись в очередь.
    source: docs/migration/DEFERRED-RESOURCES-2026-10-07.md
    notes: Закрыта корректировка очереди, а не все решения URL-MIGRATION-01.
  - id: WORK-CONFIGURATIONS-01
    title: Перенести конфигурации из Formats внутрь связанных работ
    area: information_architecture
    priority: P0
    status: done
    outcome: Work показывает варианты участия/показа и связанные документы без отдельного общего раздела Formats.
    acceptance:
      - Configuration связана с Work; независимы стадия, доступность и исторические/актуальные параметры.
      - Подготовленные MindShow и Парадокс Успеха перенесены без потери содержания; большой материал имеет связанную страницу при необходимости.
      - Внутренний райдер/датированное КП отделены от общих публичных условий; зависимости overview/PDF обновлены.
    depends_on:
      - COURSE-REVISION-01
      - PUBLICATION-SCOPE-01
    source: docs/MIGRATION-PLAN.md, раздел 2
    notes: Две конфигурации встроены в Work через ParticipationPanel; обязательный workId проверяется. Фактический ввод PDF не изменился, SHA/fingerprint прошли проверку.

  - id: EDUCATION-STRUCTURE-01
    title: Добавить Programme и раздел образования с отдельными страницами
    area: content_model
    priority: P0
    status: done
    outcome: Лекции, практикумы и учебные лаборатории имеют собственные карточки и типизированные страницы.
    acceptance:
      - Programme хранит тему, тип, аудиторию, содержание/модули, результаты, авторов, параметры, источники и связи с Case.
      - Учебная и художественная лаборатории различены; связь с Work не дублирует повествование.
      - RU/EN routes, публичная выборка, карточки, статистика и проверки принимают новый тип без ослабления общих gates.
    depends_on:
      - COURSE-REVISION-01
      - PUBLICATION-SCOPE-01
    source: docs/MIGRATION-PLAN.md, раздел 2
    notes: Восемь Programme, обзор и отдельные RU/EN-страницы, ProgrammeCard и StatisticsStamp; proposed-лаборатория явно обозначена. Публичная проекция фильтрует зависимости/медиа и не раскрывает источники. Полнота учебного корпуса/медиа остаётся EDUCATION-MIGRATION-01.

  - id: COOPERATION-STRUCTURE-02
    title: Собрать сотрудничество вокруг задач и связанных Work/Programme
    area: information_architecture
    priority: P0
    status: done
    outcome: Сотрудничество показывает общие сценарии/ответственность и ведёт к конкретным предложениям.
    acceptance:
      - Общие условия старых Formats распределены по Cooperation, конфигурациям Work и Programme по смыслу.
      - Связи приводят к конкретному содержанию; Education не остаётся общей строкой «лекция/практикум».
      - Адресные КП описаны как датированные подборки существующих сущностей; генератор и публикация частных цен не добавлены.
    depends_on:
      - WORK-CONFIGURATIONS-01
