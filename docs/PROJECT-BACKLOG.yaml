    area: migration
    priority: P0
    status: done
    outcome: Весь новый набор, роли, меню, медиа и старые входы проверены одной воспроизводимой проекцией.
    acceptance:
      - Проверены все реальные Work/Programme/Case, связи, RU/EN, обе темы, мобильный/desktop и отказ загрузки.
      - Публичные counts/routes/sitemap/assets соответствуют одной модели; документы и сохранённые оригиналы проверены по HTTP/SHA.
      - Лабораторный performance и сетевые запросы измерены заново для расширенного production candidate; старый baseline не выдан за текущий.
      - Пройдены format/unit/content/Astro/build/E2E и структурные/безопасные публикационные проверки; оставшиеся выпускные условия явно отмечены.
    depends_on:
      - WORKS-01
      - EDUCATION-MIGRATION-01
      - HISTORY-01
      - MEDIA-MIGRATION-FULL-01
      - NAVIGATION-STRUCTURE-02
      - URL-MIGRATION-01
    source: docs/MIGRATION-PLAN.md, раздел 6
    progress: "Завершено 2026-10-08: фактическая публичная проекция без синтетических approvals; 102 канонические страницы, 2430 ссылок, 279 файлов HTTP 200, 110 сочетаний ширины/темы/страницы. Три повторных Lighthouse-прогона на сценарий: главная mobile 88, desktop 100, кольца mobile 93; accessibility/SEO 100. 83 unit, 9 engine, 127 E2E, Astro/content/build/format/release прошли. Loopback без HTTP-сжатия/кеша, измерения не равны полевому INP и доставке аналитики. Подробности в inventory, отчёты приватны."

  - id: SOURCE-COVERAGE-01
    title: Сверить покрытие всех содержательных источников расширенного переноса
    area: migration
    priority: P0
    status: done
    outcome: Ни один содержательный материал не остаётся отложенным только из-за прежнего ограниченного пакета.
    acceptance:
      - Все 238 исходных ID и дополнительные источники имеют фактический результат, целевые сущности/разделы и сохранённые provenance/неизвестные значения.
      - Учтены полезные metadata-only события и связанные подтверждения заглушек; исключения имеют смысловое основание.
      - Ограничение девятью Work/тремя Format устранено в модели и реальном публичном составе, не только в тексте плана.
    depends_on:
      - WORKS-01
      - EDUCATION-MIGRATION-01
      - HISTORY-01
      - MEDIA-MIGRATION-FULL-01
      - URL-MIGRATION-01
    source: docs/MIGRATION-PLAN.md, раздел 9
    progress: "Завершено 2026-10-08: 238 версионных решений — 154 применены, 61 объединён, 23 исключены с причиной. verify-source-coverage сверяет SHA источника и существование каждой цели в реальной публичной модели; подключён к content:check. Пропущенные контексты восстановлены из источников: Бали, Частоты, Ветер перемен, Международный день медитации. Текущий корпус — 23 Work, 15 Programme, 41 Case, 17 Recognition / 13 сканов. Неподтверждённые регалии/агрегаты и синтетические отзывы не публикуются как проверенные факты."

  - id: VIDEO-PREVIEW-01
    title: Единое видеопревью по наведению и центру мобильного экрана
    area: design_system
    priority: P1
    status: done
    outcome: Первый кадр оживает только в активном контексте одним переиспользуемым компонентом.
    acceptance:
      - Desktop показывает первый кадр до наведения или клавиатурного фокуса; файл не загружается заранее.
      - Mobile/touch выбирает одно видимое превью в центральных 30% экрана; при прокрутке активное меняется.
      - Выход, скрытая вкладка, pagehide и reduced-motion/Save-Data останавливают превью и возвращают первый кадр.
      - Поздний play() не оживляет деактивированный ролик; отказ autoplay сохраняет изображение.
      - Hero и WorkCard используют VideoPreview; два живых примера и описание есть в дизайн-системе.
      - Карусель переключается вручную; полные плееры с controls остаются явным воспроизведением.
    source: Решение владельца от 2026-10-07 о desktop hover и mobile focus/centre
    notes: Все шесть используемых постеров извлечены из первого кадра соответствующего веб-ролика; фото работ не заменяются в документальных галереях. Восемь новых browser-тестов прошли; визуально проверены 390/1440 px в двух темах.

  - id: CV-MATERIALS-01
    title: Подготовить актуальные готовые CV обоих авторов для повторного использования
    area: migration
    priority: P0
    status: done
    outcome: Готовые CV связаны с биографиями и существующим портфолио без повторного переписывания для каждого адресата.
    acceptance:
