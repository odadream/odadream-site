items:
  - id: COURSE-REVISION-01
    title: Закрепить расширенный курс и очередь источников без новых документов
    area: migration
    priority: P0
    status: done
    outcome: Короткий план, принципы, бэклог и inventory описывают одну новую границу.
    acceptance:
      - План заменён компактной актуальной редакцией; полная история доступна в Git 3486e44.
      - Все 238 исходных ID получили scopeRebase с применением/пакетом; это учёт назначения источника, не утверждение выполненного переноса.
      - Статусы старых done сохранены; 95% заморожены как отдельная предыдущая база, новая сумма весов равна 100.
    source: Решения владельца 2026-10-07 и docs/MIGRATION-PLAN.md
  - id: RESOURCE-REBASE-01
    title: Вернуть прежние предложения исключения ресурсов на предметный пересмотр
    area: migration
    priority: P0
    status: done
    outcome: 170 неподтверждённых retire не применяются к новому расширенному объёму.
    acceptance:
      - 28 preserve и точные SHA остаются; 170 неутверждённых предложений отмечены review/pending-reassessment.
      - Старое основание и версия доступны в Git; никакой новый 404, redirect или разрешение не объявлены.
      - 39 дополнительных медиа выбранных работ, исторические кадры и содержательные ресурсы остальных работ вернулись в очередь.
    source: docs/migration/DEFERRED-RESOURCES-2026-10-07.md
    notes: Закрыта корректировка очереди, а не все решения URL-MIGRATION-01.
  - id: WORK-CONFIGURATIONS-01
    title: Перенести конфигурации из Formats внутрь связанных работ
    area: information_architecture
    priority: P0
    status: done
    outcome: Work показывает варианты участия/показа и связанные документы без отдельного общего раздела Formats.
    acceptance:
      - Configuration связана с Work; независимы стадия, доступность и исторические/актуальные параметры.
      - Подготовленные MindShow и Парадокс Успеха перенесены без потери содержания; большой материал имеет связанную страницу при необходимости.
      - Внутренний райдер/датированное КП отделены от общих публичных условий; зависимости overview/PDF обновлены.
    depends_on:
      - COURSE-REVISION-01
      - PUBLICATION-SCOPE-01
    source: docs/MIGRATION-PLAN.md, раздел 2
    notes: Две конфигурации встроены в Work через ParticipationPanel; обязательный workId проверяется. Фактический ввод PDF не изменился, SHA/fingerprint прошли проверку.

  - id: EDUCATION-STRUCTURE-01
    title: Добавить Programme и раздел образования с отдельными страницами
    area: content_model
    priority: P0
    status: done
    outcome: Лекции, практикумы и учебные лаборатории имеют собственные карточки и типизированные страницы.
    acceptance:
      - Programme хранит тему, тип, аудиторию, содержание/модули, результаты, авторов, параметры, источники и связи с Case.
      - Учебная и художественная лаборатории различены; связь с Work не дублирует повествование.
      - RU/EN routes, публичная выборка, карточки, статистика и проверки принимают новый тип без ослабления общих gates.
    depends_on:
      - COURSE-REVISION-01
      - PUBLICATION-SCOPE-01
    source: docs/MIGRATION-PLAN.md, раздел 2
    notes: Восемь Programme, обзор и отдельные RU/EN-страницы, ProgrammeCard и StatisticsStamp; proposed-лаборатория явно обозначена. Публичная проекция фильтрует зависимости/медиа и не раскрывает источники. Полнота учебного корпуса/медиа остаётся EDUCATION-MIGRATION-01.

  - id: COOPERATION-STRUCTURE-02
    title: Собрать сотрудничество вокруг задач и связанных Work/Programme
    area: information_architecture
    priority: P0
    status: done
    outcome: Сотрудничество показывает общие сценарии/ответственность и ведёт к конкретным предложениям.
    acceptance:
      - Общие условия старых Formats распределены по Cooperation, конфигурациям Work и Programme по смыслу.
      - Связи приводят к конкретному содержанию; Education не остаётся общей строкой «лекция/практикум».
      - Адресные КП описаны как датированные подборки существующих сущностей; генератор и публикация частных цен не добавлены.
    depends_on:
      - WORK-CONFIGURATIONS-01
      - EDUCATION-STRUCTURE-01
    source: docs/MIGRATION-PLAN.md, раздел 2
    notes: Общие сценарии и ответственность сохранены; ссылки ведут к Work-конфигурациям и восьми отдельным Programme. Частные КП/цены не опубликованы.

  - id: NAVIGATION-STRUCTURE-02
    title: Обновить меню и связанные входы под Работы/Образование/Сотрудничество
    area: information_architecture
    priority: P0
    status: done
    outcome: Целевые разделы доступны из меню/главной; старые Formats-ссылки получают подходящие назначения.
    acceptance:
      - Меню RU/EN показывает образование и остальные обзорные разделы; общие Formats убраны после переноса.
      - Ссылки Studio, Cooperation, Work и главной согласованы; новые programme/configuration доступны по прямому входу.
      - Старые Formats-адреса используют общий экран смены сайта; fallback не считается перенесённым содержанием.
    depends_on:
      - EDUCATION-STRUCTURE-01
      - COOPERATION-STRUCTURE-02
    source: docs/MIGRATION-PLAN.md, разделы 2 и 4
    notes: E Образование заменило F; ссылки главной/Studio/метода/Cooperation согласованы. Подробная Programme сохраняет активное меню образования. Решение владельца о старых адресах исполнено общим предупреждением и переходом домой.

  - id: EDUCATION-MIGRATION-01
    title: Перенести все содержательные образовательные программы и темы
    area: content
    priority: P0
    status: done
    outcome: Образовательные исходники и связанные учебные лаборатории представлены полноценно в Programme.
    acceptance:
      - Для каждого образовательного источника inventory содержит применение/объединение; лекции/практикумы не скрыты за общим Format.
      - Существующая художественная Нейросинхронизация сохраняет Work; учебная версия связана при наличии самостоятельного содержания.
      - RU/EN, авторы, темы/результаты, события, материалы и неизвестные параметры заполнены из источников.
    depends_on:
      - EDUCATION-STRUCTURE-01
      - MEDIA-GALLERY-01
    source: docs/MIGRATION-PLAN.md, разделы 2 и 3
    notes: "Начат поиск дополнительных первичных источников GDB/Obsidian. Найдены содержательные схемы «Цвет и мозг», конспекты звуковой лекции и рабочие лекционные документы; некоторые лабораторные карточки содержат только пустой frontmatter. Эти источники нужно классифицировать до расширения Programme; их обнаружение ещё не означает переноса."

    progress: "Закрыто 2026-10-07: 15 Programme, семь новых содержательных программ, модули/результаты, реальные авторские роли и четыре учебных события. Применение/объединение 51 Obsidian Markdown-источника и исходных образовательных записей зафиксировано; пустые карточки, зеркала и референсы не создают фиктивные программы. Художественная Нейросинхронизация связана с отдельным учебным практикумом. Проверены RU/EN, 68 unit, 110 E2E, Astro, build и release gate выбранного пакета. Полный отбор материалов остаётся в M3."

  - id: MEDIA-GALLERY-01
    title: Создать общие галереи с сохранением пропорций и смысловой области
    area: design_system
    priority: P0
    status: done
    outcome: Материалы разных пропорций читаются как последовательность либо плитка общим компонентом.
    acceptance:
      - Плитка/крупная последовательность описаны и показаны на стенде; фото разных пропорций, схемы, афиши и документы проверены.
      - Для обрезки задана важная область; документ показывается целиком, подпись/alt/авторство сохраняются.
      - Увеличение, клавиатура и переключение действуют на всю подборку; видео использует VideoPreview.
      - Нет overflow/потери смысла на 390/601/797/1440/1920 px в RU/EN и обеих темах; оригиналы не предзагружаются.
    depends_on:
      - VIDEO-PREVIEW-01
    source: docs/MIGRATION-PLAN.md, раздел 3
    notes: MediaGallery/MediaFigure/MediaViewer реализованы и показаны на стенде; natural/crop с явной важной областью, целые афиши/схемы/сканы, RU/EN, обе темы и 390–1920 px. Подборка, клавиатура, 1:1, отказ загрузки, возврат фокуса и остановка видео проверены; полный корпус материалов остаётся MEDIA-MIGRATION-FULL-01.

  - id: MEDIA-PREPARATION-01
    title: Подготовить сжатые изображения, страницы PDF и связанные текстовые копии
    area: media_and_content
    priority: P0
    status: done
    outcome: Один кешируемый процесс сохраняет оригиналы, готовит WebP и постраничные тексты/OCR; сайт использует общий просмотр изображений.
    acceptance:
      - Все 11 архивных PDF и шесть текущих документов подготовлены, 63 страницы связаны с текстовыми копиями; отсутствие читаемого текста и машинный OCR явно отмечены.
      - Большие изображения ограничены общими размерами/качеством, ориентация и пропорции сохранены; превышение бюджета записывается, а не скрывается.
      - Повторный запуск по неизменному источнику/политике не рендерит PDF и не извлекает/OCR текст повторно; повреждённые результаты восстанавливаются.
      - Только разрешённые типизированные владельцы включают изображения в публичную проекцию; текст и внутренние пути не экспортируются.
      - DocumentList показывает целые страницы через MediaGallery/общий просмотрщик, исходный PDF доступен дополнительно; проверены RU/EN, обе темы и 390–1920 px.
    source: Решение владельца о нормализации PDF/изображений и текстовых копиях 2026-10-07.
    notes: Два балла выделены из прежних шести баллов full-materials, общий бюджет M3 и миграции сохранён. Подготовка не закрывает распределение всех ресурсов по сущностям.

    progress: "Завершено 2026-10-08: 17 PDF / 63 страницы и 196 растровых источников подготовлены; на сайте подключены 8 документов / 10 страниц и сжатые версии текущих изображений. 213/213 повторно использованы без рендера/OCR; 7 engine, 71 unit, 113 E2E (15 повторных mobile-сценариев пропущены), Astro/build/content/release прошли. Исправлен общий сброс intrinsic ratio при lazy-загрузке; проверены RU/EN, обе темы, 390/601/797/1440/1920 px."

  - id: ARCHIVE-GALLERIES-01
    title: Применить архивные фотографии и схемы в общих галереях
    area: media_and_content
    priority: P0
    status: done
    outcome: Изображения всего художественного корпуса связаны с работами/событиями/образовательным обзором; повторы, заглушки и внешние референсы учтены отдельно.
    acceptance:
      - "Все 178 растровых источников имеют решение: 104 новых Media, 32 представленных существующими записями, 21 объединённый повтор, 8 служебных/внешних исключений; 13 сканов переданы в отдельный поток Evidence/Recognition."
      - Роль фото, рендера, схемы, афиши и кадра интерфейса соответствует изображению; названия файлов не объявляются подтверждёнными датами или фактами проведения.
      - Галереи Work/Case/Education используют общий компонент и просмотр всей подборки; внутренние оригиналы не включены в публичный артефакт.
      - Источник и SHA-256 каждой новой записи сверены; владельцы/права и отсутствие внутренних полей в публичной проекции проверены.
    depends_on: [ MEDIA-PREPARATION-01 ]
    source: Визуально проверенные материалы V1 и разрешение владельца на полный перенос материалов 2026-10-07.

    progress: "Завершено 2026-10-08: 104 новых изображения и 37 групп владельцев связаны с общими галереями. Все 178 растровых источников разобраны; 13 сканов продолжаются в Evidence/Recognition. Публичный артефакт не включает внутренние оригиналы. Проверены 74 unit, 115 E2E и дополнительные Work/Case/Education сценарии после уточнения Stories; Astro, content/build/release и визуальные 390/1440 px прошли."

  - id: MEDIA-MIGRATION-FULL-01
    title: Связать материалы полного корпуса с Work/Programme/Case
    area: media_and_content
    priority: P0
    status: done
    outcome: Галереи, документы и видео описывают весь переносимый корпус, а не только первые девять Work.
    acceptance:
      - Проверены 198 исторических содержательных ресурсов и добавленные источники; для каждого указан смысловой владелец/применение либо причина исключения.
      - 120 архивных связей и 35 без прямого Markdown-упоминания пересмотрены; старый отбор не означает непригодность.
      - Медиа имеют правильные подписи, роль фото/рендер/схема, provenance и права; данные физических предметов не подменены px файлов.
      - PDF и большие изображения подготовлены общим конвейером MEDIA-PREPARATION-01; текстовые копии связаны с исходниками и не публикуются автоматически.
      - Используются общий gallery/video/document механизмы и проверенные пути новых материалов; прежний URL не обязателен.
    depends_on:
      - RESOURCE-REBASE-01
      - MEDIA-GALLERY-01
    source: docs/MIGRATION-PLAN.md, разделы 3 и 4
    progress: "Завершено 2026-10-08: все 198 ресурсов имеют применение или обоснованное исключение. 137 Media; 17 PDF / 63 исходные страницы, 62 опубликованы (бюджетная страница исключена); 14 подтверждений, 13 реальных сканов; два полных видеорендера с кешируемыми MP4/превью/первым кадром. 78 unit, 9 engine, 122 E2E (16 повторных mobile-сценариев пропущены); Astro/build/content/release/format прошли. Оригиналы и тексты отделены от публичной проекции."

