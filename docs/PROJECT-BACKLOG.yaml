schema_version: 1
updated: 2026-10-06
maintainer: ODA.dream site team
status_values: [planned, in_progress, blocked, done]
priority_values: [P0, P1, P2]
items:
  - id: DESIGN-LINKS-01
    title: Единая CAD-выноска текстовых ссылок
    area: design_system
    priority: P1
    status: done
    outcome: CalloutLink объединяет подчёркивание каждой строки с диагональю последней строки без разрыва.
    acceptance:
      - Hero, карточки, списки, паспорта и стенд используют общий компонент и токены; хедер и футер используют простые ссылки.
      - Один пробел перед диагональю включён в полку; последнее слово и стрелка переносятся вместе.
      - Проверены RU/EN, обе темы, короткие и многострочные ссылки на мобильной и настольной ширине.
    notes: Astro check и сборка проходят; четыре целевых Playwright-проверки проходят, включая ширины 360/797/1529.
  - id: HOME-01
    title: Собрать главную как краткий обзор деятельности студии
    area: information_architecture
    priority: P0
    status: in_progress
    outcome: Каждый обзорный блок ведёт к полному разделу; главная не дублирует внутренние страницы.
    acceptance:
      - Hero ведёт к странице технологии и метода Нейромандалы.
      - Избранные работы ведут в полный каталог работ; отдельная одиночная избранная работа отсутствует.
      - Карточки имеют общий шаблон: медиа, категория, типизированный статус, название, краткий текст; последовательные коды контентных элементов отсутствуют.
      - Главная показывает выбранные признания из старого публичного архива и ведёт в полный архив; найденные сканы имеют превью, публикация остаётся за правовым gate.
      - Счётчики работ, кейсов и признаний вычисляются из тех же записей, что и списки.
      - Краткий метод расположен после работ и ведёт к подробному объяснению медиума.
      - Избранная хронология ведёт к полному архиву событий.
      - Признания и контакт имеют явные маршруты углубления.
    depends_on: [HERO-01, WORKS-01, METHOD-01, HISTORY-01, RECOG-01]

  - id: HERO-01
    title: Создать страницу базовой технологии Нейромандалы и hero-карусель
    area: media_and_content
    priority: P0
    status: in_progress
    outcome: Hero показывает несколько форм Нейромандалы и объясняет технологическое/художественное ядро.
    acceptance:
      - Шесть перечисленных владельцем исходников имеют проверенные подписи, даты, авторство и права.
      - HeroVisual не хранит копии названия/подзаголовка: карточка получает редакционные поля из Work, а доказанный контекст — из CaseEvent. `unmapped` не выпускается.
      - Каждый опубликованный кадр ведёт к канонической Work и связанному CaseEvent; неподтверждённую связь не выдумывать.
      - Перемешивание меняет порядок на новую сессию, но не сбрасывается при каждом рендере слайда.
      - Только активный ролик загружается и воспроизводится; есть постер, ручные элементы управления и понятная подпись.
      - Для reduced-motion, экономии трафика и мобильного соединения доступен постер без автопроигрывания.
      - Минутный исходник «Частоты» получает отдельный короткий веб-фрагмент с подтверждённой точкой обрезки.
    notes: Hero — полноэкранный видеокадр с эпиграфом и конкретным предложением о студии; компактная этикетка и датированный агрегат вторичны. На мобильном агрегат расположен под видео. Читаемость вступления обеспечивает градиент в полноразмерном слое без видимого края плашки.
    progress: "Пять источников скопированы в локальные короткие MP4-превью с постерами. Заголовки и детали берутся из записей медиа/работ; MindShow ведёт на страницу работы, но не на BYOB-кейс, пока источник этого конкретного ролика не подтверждён. Сохранено пять HeroVisual, на главной показаны четыре: прототип Предков исключён общей выборкой. Две формы unmapped; выбранные Media имеют права cleared по разрешению владельца от 2026-10-05. Шестой MOV не найден."

  - id: MINDDB-01
    title: Проверить источник и допустимость статистики MindDB для публичного сайта
    area: data_integration
    priority: P0
    status: in_progress
    outcome: Зафиксирован источник данных, поля, методика подсчёта и безопасный экспорт для статической сборки.
    acceptance:
      - Непринятый aggregate исключается вместе с его компонентом из публичного результата и не блокирует выпуск остального пакета.
      - При показе агрегата указаны единица, scope, дата и coverage; отсутствие классификации ритмов не требует её внедрения для выпуска сайта без этой метрики.
      - Владелец указывает точный адрес/путь Golem Data Base или MindDB и ответственного за доступ.
      - Подтверждены определения take, mandala, длительности и классификации тета/альфа/бета/гамма.
      - Утверждены обезличивание, согласие, права и допустимость публикации агрегатов.
      - Выбран воспроизводимый снимок данных для сборки и сценарий устаревших/недоступных данных.
    depends_on: [HERO-01]
    notes: >-
      Есть агрегированный baseline на 2026-08-30: 150 сессий, 1 751 тейк, 1 348 видео с измеренной суммарной длительностью около 69,8 часа.
      В hero показаны 1 751 запись и округлённые 70 ч. с датой выгрузки; исходные 69,8 ч. сохранены в данных.
      Снимок publication/privacyReview=review защищён release gate. Ритмы не классифицированы; публичный выпуск требует согласия, privacy review и утверждённой методики.

  - id: WORKS-01
    title: Развернуть полный каталог курируемых работ
    area: content
    priority: P1
    status: in_progress
    outcome: Главная показывает выборку; раздел работ содержит проверенные страницы и различает работу от заказа.
    progress: "Сверены 34 product-записи старого сайта и локальные portfolio/provenance-снимки Golem. migration/INVENTORY-2026-10-05.json содержит полный исходный перечень, неоднозначности и предложение разделить тип, стадию, репертуар, доступность и тираж. Решения владельца от 2026-10-05 перенесены в данные: каноническое название игры, составная Эмомандала, концепт Круга на основе Нейросинхронизации и прототип Предков. В каталоге 9 работ; главная содержит 6 реализованных, отдельная подборка R&D доступна только в Работах. Полный корпус ещё не перенесён."
    acceptance:
      - Для каждой перенесённой работы заполнены RU/EN title, summary, статус, опыт участника, медиа, provenance и доступность.
      - Форматы заказа связаны с работами ID-ссылками и не подменяют произведения.
      - Исторические, архивные и R&D-работы не обозначены доступными к заказу без подтверждения.

  - id: METHOD-01
    title: Углубить страницу метода и биологической обратной связи
    area: content
    priority: P1
    status: in_progress
    outcome: Посетитель понимает сигнал, художественное преобразование, опыт участника и ограничения интерпретации.
    acceptance:
      - Отдельно объяснены сигнал, перевод в сценический/визуальный материал и опыт участника.
      - Нет медицинских обещаний и заявлений о чтении мыслей или чувств.
      - Добавлены подходящие примеры работ и источники.

  - id: HISTORY-01
    title: Создать модель хронологии и полный список событий
    area: content_model
    priority: P1
    status: in_progress
    outcome: Вехи главной и полный архив событий формируются из одних записей.
    acceptance:
      - Событие хранит дату, место, работу, роль ODA.dream, организации и источники.
      - Выбранные вехи ссылаются на соответствующие кейсы.
      - Хронология не дублирует каталог произведений.
    depends_on: []
    notes: Главная уже строит выбранные вехи из CaseEvent; перенесены только четыре записи, это пока не полный реестр. Перенос выбранных кейсов выполняется в текущей общей схеме; переход на Content Collections не является блокировкой.

  - id: RECOG-01
    title: Спроектировать модель и архив наград, сертификатов и благодарственных писем
    area: evidence
    priority: P1
    status: in_progress
    outcome: Подтверждённые признания представлены как архивные документы с provenance и правами.
    notes: В прежнем публичном перечне 14 позиций (2 диплома, 11 благодарностей, 1 участие); счётчик зафиксирован с хешем источника. В новую типизированную модель перенесены пять записей со статусом review. Четыре представлены на локальной главной; для трёх найдены и скопированы превью. Скан МФТИ по старому пути не найден. Release gate по правам закрыт.
    acceptance:
      - Различаются award, certificate, acknowledgement letter, press и event record.
      - Каждая запись связана с автором/организацией, датой, событием, источником и разрешением публикации.
      - Главная показывает короткую выборку и ссылку на полный архив без внутреннего скролл-контейнера.
      - Неопубликованные или неразрешённые документы исключены из публичного вывода.

  - id: SOCIAL-01
    title: Добавить локализованные социальные каналы в контентную модель и футер
    area: localization
    priority: P2
    status: in_progress
    notes: Официальные URL Telegram, YouTube, Instagram и Дзен перенесены. Профиль VK не подтверждён; не подменять ссылкой на публикацию.
    acceptance:
      - EN: Telegram, YouTube, Instagram.
      - RU: Telegram, Дзен, VK, Instagram.
      - Ссылки имеют текстовые названия, доступные подписи и подтверждённые URL.

  - id: CMS-01
    title: Перенести записи из TypeScript-массивов в схему Astro Content Collections
    area: architecture
    priority: P1
    status: planned
    outcome: Редакторские записи редактируются отдельно от компонентов, статическая сборка и типизированные связи сохраняются.
    acceptance:
      - Стадия Work, состояние проведения/заявки, publication и доступность независимы; неизвестные значения не заменяются догадками.
      - Manifest выбранного пакета сохраняет V1/V2 IDs, известные GDB references и точные источники/ревизии; новая CMS не блокирует первый выпуск.
      - Схемы проверяют обязательные RU/EN-поля, статусы, права, источники и стабильные ID.
      - Сборка проверяет ссылки Work–Format–Case–Evidence–Organization–Media.
      - Перенос не ломает legacy ID map, canonical routes и sitemap.
      - Решение о GUI-CMS принимается после описания редакторов, ролей и согласования.

  - id: GDB-01
    title: Уточнить назначение Golem Data Base в архитектуре сайта
    area: architecture
    priority: P2
    status: in_progress
    outcome: Отдельный датированный агрегат Golem можно воспроизвести без экспорта записей отдельных событий.
    acceptance:
      - Первый выпуск автономен на закреплённом публичном пакете и не зависит от завершения T-OWN-003 или живого GDB API.
      - Trusted_internal core packet не копируется в public; публичный экспорт имеет allowlist, schema version, источник/ревизию, дату и scope метрик.
      - Определены владелец системы, точный продукт, API/экспорт и политика доступа.
      - Определены публичные поля и правила обработки персональных/биометрических данных.
      - Статическая сборка не содержит путей, названий и персональных данных из внутреннего реестра.
      - Определён процесс обновления и контроля возраста снимка до публикации.
    notes: Локальный read-only event_registry.json дал снимок 55 архивных папок на 2026-08-31. Скрипт stats:golem экспортирует только суммарные категории качества связей; это не публичная таксономия типов событий и не живая API-интеграция.

  - id: DESIGN-01
    title: Поддерживать единый источник токенов и живую спецификацию компонентов
    area: design_system
    priority: P1
    status: in_progress
    outcome: Публичный сайт и /design-system/ используют общие токены и демонстрируют актуальные интерактивные состояния.
    acceptance:
      - Основные значения задаются в src/styles/tokens.css.
      - Новые паттерны добавляются в спецификацию и используются общими компонентами.
      - RU/EN и desktop/mobile проверяются после изменения общих правил.
      - В локальной навигации есть /design-system/; темы авто/свет/тьма используют те же CSS-токены на стенде и сайте.
      - Двухуровневые коды страницы/раздела и цвет префикса демонстрируются на стенде; карточки контента не получают порядковых кодов.
    source: docs/DESIGN-SYSTEM-SOURCE.md

  - id: STATS-01
    title: Развить достоверные счётчики витрины
    area: data_integration
    priority: P1
    status: in_progress
    outcome: Главная показывает масштаб работ, кейсов и признаний без смешения курируемого сайта с внутренним архивом.
    acceptance:
      - Работы и статусы считаются из Work, кейсы и типы из CaseEvent, признания и виды из Recognition.
      - Golem-число имеет дату, единицу счёта и явное отличие от проверенных публичных кейсов.
      - Полный корпус работ ODA.dream и таксономия всех событий Golem выводятся только после достоверного публичного экспорта.
    depends_on: [GDB-01]
    notes: CMS-01 не блокирует подсчёт в текущей типизированной схеме. GDB-01 требуется для расширенных внешних метрик; их можно отложить без остановки первого переключения сайта.

  - id: DESIGN-02
    title: Добавить функциональный слой полей, индексов и паспортов
    area: design_system
    priority: P1
    status: done
    outcome: Главная использует заметки, вертикальные коды и тихие залитые номера; работы и события имеют паспорта; медиа имеют техническую подпись.
    acceptance:
      - Каждый графический элемент имеет описанное назначение и проверяемый источник значений.
      - Фоновый номер не подменяет читаемый код; на телефоне поля и заметки скрыты, статистика следует после материала.
      - Сайт и раздел 11 дизайн-системы используют общие SectionRail, StatisticsStamp, RecordStamp и MediaFigure.
      - Паспорта и статистика образуют непрерывные сетки ячеек; заголовок не дублируется на поле.
      - Выходные данные содержат обновление, версию движка, локальное предыдущее посещение и рабочее копирование ссылки.
      - DESIGN-GUIDE.md определяет представление всех типов данных; AGENTS.md требует его чтения.
    source: docs/DESIGN-GUIDE.md

  - id: DESIGN-03
    title: Выверить ритм, адаптивность и интерактивные состояния
    area: design_system
    priority: P1
    status: done
    acceptance:
      - Карточки выровнены общими строками без обрезки текста и фиксированной высоты метаданных.
      - Высота мобильного hero учитывает естественную высоту статистики.
      - Якоря не скрываются шапкой; все контролы имеют общую focus-обводку.
      - Карусель имеет стрелки без видимой паузы; автоматическая смена кадров приостанавливается при наведении и фокусе, а видео останавливается вне экрана.
      - Состояния и правила показаны в дизайн-системе и DESIGN-GUIDE.md.
      - Статистика использует фоновую роль reference, без яркого числового акцента.
      - Палитра навигации и разделов, сетка страниц и стенда параметризованы единым профилем.
      - Фоновые номера залитые Manrope 800; условные знаки используют единый векторный набор и словесную легенду.

  - id: DESIGN-04
    title: Согласовать оси сайта и стенда на всех маршрутах
    area: design_system
    priority: P1
    status: done
    acceptance:
      - Hero, шапка, выходные данные и футер совпадают по внешним краям контейнера, включая широкие экраны.
      - Панели не сдвигают заголовки и материал относительно общей внутренней оси.
      - Фоновые номера имеют одинаковый размер при одинаковой ширине экрана.
      - Верх вступления, интервалы секций и сетка стенда заданы общими токенами.
      - Автотест геометрии проверяет все страницы реестра RU/EN и стенд на 360/797/1529/1920 px.
    source: docs/DESIGN-GUIDE.md

  - id: PERF-01
    title: Обновить лабораторный performance baseline и бюджет загрузки
    area: performance
    priority: P2
    status: planned
    outcome: Повторяемые desktop/mobile замеры указывают на узкие места, регрессии и проверяемые бюджеты производительности.
    acceptance:
      - Lighthouse запускается на production build в desktop и mobile профилях минимум три раза; фиксируется медиана и окружение.
      - Network waterfall фиксирует вес первого экрана, eager/lazy медиа, шрифты, число запросов и поведение при reduced-motion/Save-Data.
      - Отдельно фиксируются LCP, CLS и TBT; INP не имитируется лабораторным тестом и помечается как требующий полевых данных.
      - Playwright memory failure воспроизводится на минимальном сценарии и устраняется либо документируется ограничение среды.
      - docs/QUALITY-BASELINE.md обновляется только измеренными данными и сохраняет историю условий замера.
    notes: Кодовая оптимизация hero и legacy bridge выполнена; текущий baseline от 2026-09-22 не измеряет эти изменения.

  - id: QA-01
    title: Ввести семантический линтинг TypeScript, Astro и CSS
    area: code_quality
    priority: P2
    status: planned
    outcome: Ошибки использования API, некорректные стили и недоступные паттерны обнаруживаются до review.
    acceptance:
      - ESLint проверяет JS/TS/Astro с правилами для неиспользуемого кода и доступности; Stylelint проверяет CSS и объявления токенов.
      - Конфигурации не дублируют форматирование Prettier и типовую проверку Astro.
      - npm run lint запускается локально и в обеих CI-проверках без ложных срабатываний на текущем коде.
    notes: Сейчас доступны Prettier, astro check, content/build gate и Playwright; format:check добавлен в CI, но семантического ESLint/Stylelint ещё нет.

  - id: ARCH-01
    title: Разделить общий клиентский скрипт и каскад стилей по функциям
    area: architecture
    priority: P2
    status: planned
    outcome: Изменения отдельной страницы не требуют правки общего длинного обработчика и не создают скрытых CSS-переопределений.
    acceptance:
      - Навигация, тема, lightbox и домашняя карусель инициализируются из отдельных модулей только при наличии нужного DOM.
      - Глобальные стили разделены по компонентным ролям с явным порядком импорта; значения остаются в src/styles/tokens.css.
      - Удалены подтверждённо неиспользуемые правила и повторные объявления; визуальная матрица и все E2E проходят.
      - Измеренный клиентский JS gzip и CSS не увеличиваются без объяснённой причины.
    notes: Сейчас BaseLayout.astro содержит общий обработчик для всех маршрутов, а global.css — около 1470 строк; это долг по сопровождению, не доказанный performance-регресс.

  - id: DESIGN-FOOTER-01
    title: Компактный служебный футер
    area: design_system
    priority: P1
    status: done
    outcome: Только контакты, студия и соцсети, без CAD-стрелок; официальный символ Дзена и подпись ODA.dream®.
    acceptance:
      - Футер использует простые ссылки и общий клавиатурный фокус.
      - Состав социальных ссылок зависит от языка.
      - Копирайт сохраняет регистр бренда и диапазон лет; источник регистрации отмечен в DESIGN-SYSTEM-SOURCE.md.

  - id: DESIGN-CARDS-01
    title: Стандартизировать поля и геометрию карточек работ
    area: design_system
    priority: P1
    status: done
    outcome: Единый WorkCard и четыре структурных ряда во всех контекстах; обязательные данные проверяются валидатором.
    acceptance:
      - Тип, название, стадия, описание и превью заполнены у всех девяти работ.
      - Год хранится отдельным полем, неизвестный год явно null.
      - Медиаподпись не добавляет пятый ряд; тип использует доступную ширину.
      - Геометрия проверена на 390/601/1440 px в RU/EN, на главной, в каталоге и дизайн-системе.

  - id: MIGRATION-PLAN-01
    title: Сопоставить V1 и V2 и подготовить план миграции
    area: migration
    priority: P0
    status: done
    outcome: MIGRATION-PLAN.md содержит сравнительный анализ, очередность M0–M6, критерии приёмки и процедуру переключения/отката.
    acceptance:
      - Учтены 238 старых ID и 550 архивных публичных ресурсов, источники и хеши записей сохранены в migration/INVENTORY-2026-10-05.json.
      - Совместимость URL отделена от полноты содержания, опубликованный архив отличается от рабочих дополнений.
      - Существующее разрешение владельца на показ работ учтено без повторного общего согласования.
    notes: Редакция GDB/outreach принята техническим ревью V2 от 2026-10-06. Новые художественные страницы добавляются по непокрытому сценарию, без обязательного числа; миграция и публикация ещё не выполнены.

  - id: URL-MIGRATION-01
    title: Завершить решения по старым входам и публичным ресурсам
    area: migration
    priority: P0
    status: planned
    outcome: Каждый старый ID и значимый публичный ресурс имеет проверенный целевой маршрут или осознанное архивное решение.
    acceptance:
      - Аудит охватывает PDF, видео и пути вне images/content, текущие 172 отсутствующих пути имеют решение.
      - Все 238 ID классифицированы, fallback не выдаётся за завершённый перенос статьи.
      - Учтены ссылки из отправленных PDF, писем и досье; значимый outreach-вход получает точное или объяснимое назначение.
      - Проверены lang, internal=true, aliases, парные маршруты и HTTP-статусы файлов.
      - Определена необходимость HTTP redirect-слоя, клиентский переход не называется 301.
    depends_on: [MIGRATION-PLAN-01]

  - id: ANALYTICS-MIGRATION-01
    title: Перенести измеримость действий посетителя в V2
    area: analytics
    priority: P0
    status: planned
    outcome: Согласованные page_view и контактные/медиа-действия измеряются с корректным согласием и без дублей.
    acceptance:
      - Зафиксированы необходимые события и конфигурация провайдеров без публикации секретов.
      - Старый ID-переход не создаёт двойную конверсию.
      - Сохраняются Work/Format, язык и материал без данных адресатов; email-клик считается намерением, а не состоявшейся заявкой.
      - Наблюдение событий проверено на тестовом окружении до переключения домена.
    depends_on: [MIGRATION-PLAN-01]

  - id: MIGRATION-CONTENT-01
    title: Уточнить полезный объём и способы преобразования корпуса V1
    area: migration
    priority: P0
    status: done
    outcome: Все 238 записей получили содержательную роль и способ преобразования в editorialReview, MIGRATION-PLAN.md уточняет план.
    acceptance:
      - Явные заглушки, служебные ветки и пустая навигация отделены от полезных текстов и структурных фактов.
      - Длина текста не служит критерием исключения галерей, доказательств и событий.
      - Число исходников не объявляется количеством обязательных новых страниц, повторы объединяются под задачи V2.
      - Первое исполнение ограничено проверкой ядра и выбранным смысловым пакетом вместо копирования 1к1.
    depends_on: [MIGRATION-PLAN-01]
    notes: Факты и авторство в отобранном пакете проверяются отдельно, рекомендации о приоритетах не являются утверждённым художественным ранжированием.

  - id: REFACTOR-V2-01
    title: Устранить дублирование правил каталога и документации
    area: architecture
    priority: P1
    status: done
    outcome: Общие выборки каталога и загрузчик данных для проверок; ожидаемые пути сборки берутся из реестра маршрутов.
    acceptance:
      - Реализация определяется stage, дублирующего realized в Work нет.
      - Главная и статистика используют общие выборки, доступность остаётся самостоятельным полем.
      - Описание миграции ограничено MIGRATION-PLAN.md и migration/INVENTORY-2026-10-05.json.
      - Принятые решения владельца находятся в CONTENT-AND-CMS.md, контракт карточки в DESIGN-GUIDE.md.
    notes: Проверены форматирование, 10 unit-тестов, content-check, Astro check, build и 40 браузерных тестов (4 дублирующие проверки пропущены). Согласование миграции остаётся отдельным шагом; release gate сохраняет ожидаемые блокировки.

  - id: PUBLICATION-SCOPE-01
    title: Общая публичная выборка для рендеринга и release gate
    area: architecture
    priority: P0
    status: planned
    outcome: Отложенные записи не блокируют выпуск выбранного пакета и не попадают в публичные routes, HTML, JSON или assets.
    acceptance:
      - Render, routes/sitemap, статистика и release gate используют одну публикационную выборку с её зависимостями.
      - Скрытые hero и отложенные Recognition/MindDB aggregate не блокируют выпуск; их карточки, блоки и закрытые assets отсутствуют в публичном результате.
      - Для включённых материалов сохраняются проверки фактов, разрешений, приватности и целостности связей; фильтрация не подменяет решения по историческим URL.
      - Проверены два сценария на fixtures: review запись вне публичного пакета не блокирует выпуск; включённая запись с нерешённой приватностью/разрешением блокирует.
    source: docs/MIGRATION-PLAN.md
    notes: Уточнение принято владельцем 2026-10-05; реализация ещё не выполнена. Gate сейчас проверяет полный сохранённый набор, MindDBStamp не фильтрует publication/privacyReview.


  - id: MIGRATION-ACCEPTANCE-01
    title: Сценарная и визуальная приёмка выбранного выпуска V2
    area: migration
    priority: P0
    status: planned
    outcome: Выбранный публичный пакет закрывает типовые обращения и понятен при прямом входе и пересылке.
    acceptance:
      - Work/Format/Cooperation/Studio отвечают на типовые вопросы кураторского, агентского, производственного и образовательного обращения.
      - Нейромандала объясняет метод и визуальный язык самостоятельно; согласованы условия трёх текущих форматов и сценарии Cooperation.
      - Существующие биографии/CV, технический обзор, программа лаборатории и выбранные доказательства актуальны; требуемые документы имеют дату и подходящий объём.
      - При прямом входе, пересылке и на мобильном в RU/EN доступны объяснение, подтверждение и следующий шаг; неизвестные параметры не выдуманы.
      - Адресные концепции, адаптации, цены и бюджеты не выдаются за готовые или согласованные общие предложения и не блокируют выпуск общего сайта.
      - Визуальные уточнения проходят общие компоненты, токены и стенд V5/V2; проверены участие человека, подписи примеров, карточки и паспорта.
      - Выпуск проходит технические проверки, общий publication gate и решения по историческим URL; расширение каталога не имеет обязательного количества.
    depends_on: [PUBLICATION-SCOPE-01, URL-MIGRATION-01, ANALYTICS-MIGRATION-01]
    source: docs/MIGRATION-PLAN.md
    notes: Вводы по конкретным адресатам основаны на датированном отчёте outreach-агента. Их текущие статусы проверяются в переписке при исполнении; второй CRM или публичные страницы адресатов не создаются.
