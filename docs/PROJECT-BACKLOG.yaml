    title: Обновить лабораторный performance baseline и бюджет загрузки
    area: performance
    priority: P2
    status: planned
    outcome: Повторяемые desktop/mobile замеры указывают на узкие места, регрессии и проверяемые бюджеты производительности.
    acceptance:
      - Lighthouse запускается на production build в desktop и mobile профилях минимум три раза; фиксируется медиана и окружение.
      - Network waterfall фиксирует вес первого экрана, eager/lazy медиа, шрифты, число запросов и поведение при reduced-motion/Save-Data.
      - Отдельно фиксируются LCP, CLS и TBT; INP не имитируется лабораторным тестом и помечается как требующий полевых данных.
      - Playwright memory failure воспроизводится на минимальном сценарии и устраняется либо документируется ограничение среды.
      - docs/QUALITY-BASELINE.md обновляется только измеренными данными и сохраняет историю условий замера.
    notes: Кодовая оптимизация hero и legacy bridge выполнена; текущий baseline от 2026-09-22 не измеряет эти изменения.

  - id: QA-01
    title: Ввести семантический линтинг TypeScript, Astro и CSS
    area: code_quality
    priority: P2
    status: planned
    outcome: Ошибки использования API, некорректные стили и недоступные паттерны обнаруживаются до review.
    acceptance:
      - ESLint проверяет JS/TS/Astro с правилами для неиспользуемого кода и доступности; Stylelint проверяет CSS и объявления токенов.
      - Конфигурации не дублируют форматирование Prettier и типовую проверку Astro.
      - npm run lint запускается локально и в обеих CI-проверках без ложных срабатываний на текущем коде.
    notes: Сейчас доступны Prettier, astro check, content/build gate и Playwright; format:check добавлен в CI, но семантического ESLint/Stylelint ещё нет.

  - id: ARCH-01
    title: Разделить общий клиентский скрипт и каскад стилей по функциям
    area: architecture
    priority: P2
    status: planned
    outcome: Изменения отдельной страницы не требуют правки общего длинного обработчика и не создают скрытых CSS-переопределений.
    acceptance:
      - Навигация, тема, lightbox и домашняя карусель инициализируются из отдельных модулей только при наличии нужного DOM.
      - Глобальные стили разделены по компонентным ролям с явным порядком импорта; значения остаются в src/styles/tokens.css.
      - Удалены подтверждённо неиспользуемые правила и повторные объявления; визуальная матрица и все E2E проходят.
      - Измеренный клиентский JS gzip и CSS не увеличиваются без объяснённой причины.
    notes: Сейчас BaseLayout.astro содержит общий обработчик для всех маршрутов, а global.css — около 1470 строк; это долг по сопровождению, не доказанный performance-регресс.

  - id: DESIGN-FOOTER-01
    title: Компактный служебный футер
    area: design_system
    priority: P1
    status: done
    outcome: Только контакты, студия и соцсети, без CAD-стрелок; официальный символ Дзена и подпись ODA.dream®.
    acceptance:
      - Футер использует простые ссылки и общий клавиатурный фокус.
      - Состав социальных ссылок зависит от языка.
      - Копирайт сохраняет регистр бренда и диапазон лет; источник регистрации отмечен в DESIGN-SYSTEM-SOURCE.md.

  - id: DESIGN-CARDS-01
    title: Стандартизировать поля и геометрию карточек работ
    area: design_system
    priority: P1
    status: done
    outcome: Единый WorkCard и четыре структурных ряда во всех контекстах; обязательные данные проверяются валидатором.
    acceptance:
      - Тип, название, стадия, описание и превью заполнены у всех девяти работ.
      - Год хранится отдельным полем, неизвестный год явно null.
      - Медиаподпись не добавляет пятый ряд; тип использует доступную ширину.
      - Геометрия проверена на 390/601/1440 px в RU/EN, на главной, в каталоге и дизайн-системе.

  - id: MIGRATION-PLAN-01
    title: Сопоставить V1 и V2 и подготовить план миграции
    area: migration
    priority: P0
    status: done
    outcome: MIGRATION-PLAN.md содержит сравнительный анализ, очередность M0–M6, критерии приёмки и процедуру переключения/отката.
    acceptance:
      - Учтены 238 старых ID и 550 архивных публичных ресурсов, источники и хеши записей сохранены в migration/INVENTORY-2026-10-05.json.
      - Совместимость URL отделена от полноты содержания, опубликованный архив отличается от рабочих дополнений.
      - Существующее разрешение владельца на показ работ учтено без повторного общего согласования.
    notes: Редакция GDB/outreach принята техническим ревью V2 от 2026-10-06. Новые художественные страницы добавляются по непокрытому сценарию, без обязательного числа; миграция и публикация ещё не выполнены.

  - id: URL-MIGRATION-01
    title: Проверить новые ссылки и простой переход устаревших входов
    area: migration
    priority: P0
    status: done
    outcome: Старые страницы показывают предупреждение и ведут на главную; новый корпус имеет корректные ссылки и документы.
    acceptance:
      - Старый ?id, /formats/ и 404 показывают общий RU/EN экран, ручную ссылку и переход через 5 секунд без runtime-таблицы ID.
      - internal=true не даёт доступ; noindex экраны отсутствуют в sitemap; клиентский переход не называется HTTP 301.
      - Проверены внутренние ссылки, якоря, языки и HTTP-статусы фактически включённых материалов полного нового корпуса.
      - Все содержательные источники учитываются отдельно от предупреждения; сохранение 198 старых файловых URL не является условием выпуска.
    depends_on:
      - WORKS-01
      - EDUCATION-MIGRATION-01
      - HISTORY-01
      - MEDIA-MIGRATION-FULL-01
      - NAVIGATION-STRUCTURE-02
    source: Решение владельца 2026-10-07 о необязательности старых адресов.
    notes: "Завершено 2026-10-08: build проверяет все 104 локализованных HTML, 2412 внутренних ссылок и 1548 ссылок на ресурсы, включая lazy-media и якоря. HTTP: 102 канонические страницы и 279 разрешённых файлов — 200; 25 внутренних оригиналов/исключённых материалов — 404. Общие старые входы, RU/EN, noindex, таймер и запрет internal=true подтверждены E2E. Точные старые URL не являются условием выпуска."

  - id: LEGACY-COMPATIBILITY-CORE-01
    title: Сохранить контекст старых входов и точные адреса выбранных превью
    area: migration
    priority: P0
    status: done
    outcome: Все 238 ID проверяются в обеих языковых версиях, четыре дополнительных старых адреса изображений связаны с выбранными Media без обхода публикационной выборки.
    acceptance:
      - Известная неперенесённая запись сохраняет ID/lang, internal=true не открывает закрытую запись.
      - Старые пути изображений побайтно совпадают с источником и проверяются SHA-256.
      - Draft/review и restricted не публикуют дополнительные ресурсы; план preserve без файла не снимает release gate.
      - Ошибка загрузки manifest и некорректный якорь приводят к безопасному fallback.
    depends_on: [ MEDIA-AUDIT-FULL-01, PUBLICATION-SCOPE-01 ]
    notes: Историческая проверка до изменения курса. С 2026-10-07 точные соответствия ID/URL и публичный resolver отменены владельцем; текущий контракт и проверки — URL-MIGRATION-01. Сохранённые исходные файлы можно переиспользовать, но их старые адреса не являются обязательством.

  - id: ANALYTICS-MIGRATION-01
    title: Перенести измеримость действий посетителя в V2
    area: analytics
    priority: P0
    status: blocked
    outcome: Согласованные page_view и контактные/медиа-действия измеряются с корректным согласием и без дублей.
    acceptance:
      - Зафиксированы необходимые события и конфигурация провайдеров без публикации секретов.
      - Старый ID-переход не создаёт двойную конверсию.
      - Сохраняются Work/Format, язык и материал без данных адресатов; email-клик считается намерением, а не состоявшейся заявкой.
      - Наблюдение событий проверено на тестовом окружении до переключения домена.
    depends_on: [ MIGRATION-PLAN-01 ]
    notes: "Общий runtime и mock-адаптеры готовы. Read-only доступ через oda-analytics-hub подтверждён живыми API GA4/Метрики; настройки и агрегаты за 90 дней зафиксированы в inventory. Все enhanced measurement события действующего GA4 включены; у Метрики включены clickmap/ecommerce/YTM. Подготовлено предложение отдельного потока/счётчика V2; согласование, настройка и наблюдение тестовых событий ещё не выполнены. Google OAuth grant имеет analytics.readonly без analytics.edit; создание нового потока требует отдельного внешнего действия. Конфигурация V2 остаётся disabled. Блокирующее условие: разрешение на изолированную настройку/тест и Google analytics.edit либо настроенный владельцем поток. Независимые структура, контент и медиа продолжаются."

  - id: MIGRATION-CONTENT-01
    title: Уточнить полезный объём и способы преобразования корпуса V1
    area: migration
    priority: P0
    status: done
    outcome: Все 238 записей получили содержательную роль и способ преобразования в editorialReview, MIGRATION-PLAN.md уточняет план.
    acceptance:
      - Явные заглушки, служебные ветки и пустая навигация отделены от полезных текстов и структурных фактов.
      - Длина текста не служит критерием исключения галерей, доказательств и событий.
      - Число исходников не объявляется количеством обязательных новых страниц, повторы объединяются под задачи V2.
      - Первое исполнение ограничено проверкой ядра и выбранным смысловым пакетом вместо копирования 1к1.
    depends_on: [ MIGRATION-PLAN-01 ]
    notes: Факты и авторство в отобранном пакете проверяются отдельно, рекомендации о приоритетах не являются утверждённым художественным ранжированием.

  - id: REFACTOR-V2-01
    title: Устранить дублирование правил каталога и документации
    area: architecture
    priority: P1
    status: done
    outcome: Общие выборки каталога и загрузчик данных для проверок; ожидаемые пути сборки берутся из реестра маршрутов.
    acceptance:
      - Реализация определяется stage, дублирующего realized в Work нет.
      - Главная и статистика используют общие выборки, доступность остаётся самостоятельным полем.
      - Описание миграции ограничено MIGRATION-PLAN.md и migration/INVENTORY-2026-10-05.json.
      - Принятые решения владельца находятся в CONTENT-AND-CMS.md, контракт карточки в DESIGN-GUIDE.md.
    notes: Проверены форматирование, 10 unit-тестов, content-check, Astro check, build и 40 браузерных тестов (4 дублирующие проверки пропущены). Согласование миграции остаётся отдельным шагом; release gate сохраняет ожидаемые блокировки.

  - id: PUBLICATION-SCOPE-01
    title: Общая публичная выборка для рендеринга и release gate
    area: architecture
    priority: P0
    status: done
    outcome: Отложенные записи не блокируют выпуск выбранного пакета и не попадают в публичные routes, HTML, JSON или assets.
    acceptance:
      - Render, routes/sitemap, статистика и release gate используют одну публикационную выборку с её зависимостями.
      - Скрытые hero и отложенные Recognition/MindDB aggregate не блокируют выпуск; их карточки, блоки и закрытые assets отсутствуют в публичном результате.
      - Для включённых материалов сохраняются проверки фактов, разрешений, приватности и целостности связей; фильтрация не подменяет решения по историческим URL.
      - "Проверены два сценария на fixtures: review запись вне публичного пакета не блокирует выпуск; включённая запись с нерешённой приватностью/разрешением блокирует."
    source: docs/MIGRATION-PLAN.md
    notes: Реализовано 2026-10-06. Версионный publication-plan задаёт выбранные ID, scope проверяет статусы и зависимости; dev остаётся редакционным предпросмотром, build исключает отложенные routes/HTML/assets. Старые URL разрешаются через отдельный resolver; их решения и редакционные статусы не подменены. Проверены 19 unit-тестов, 42 браузерных теста (6 дублирующих пропущены), Astro и сборка. Проверки двух сценариев выполнены на fixtures, фактические routes/файлы и legacy переходы проверены в браузере.

  - id: MIGRATION-ACCEPTANCE-01
    title: Отдельная редакционная и визуальная приёмка после полного переноса
    area: migration
    priority: P0
    status: planned
    outcome: Выбранный публичный пакет закрывает типовые обращения и понятен при прямом входе и пересылке.
    acceptance:
      - После технического завершения миграции выполнены самостоятельные проходы дизайна и общего/постраничного контента.
      - Work/Programme/Configuration/Cooperation/Studio отвечают на типовые вопросы посетителей; адресные КП остаются отдельной работой.
      - Перед переключением выполнены publication/release gate и явное разрешение выпуска.
    depends_on:
      - MIGRATION-COMPLETE-01
    source: docs/MIGRATION-PLAN.md
    notes: Не входит в процент подготовки содержательного переноса. Пользователь до его завершения проверяет структуру, а не обязан вчитываться в каждый текст.

  - id: MIGRATION-COMPLETE-01
    title: Завершить расширенный содержательный перенос до отдельных проходов по слоям
    area: migration
    priority: P0
    status: planned
    outcome: Работы, образование, история, связанные материалы и совместимость полного содержательного корпуса перенесены и проверены.
    acceptance:
      - Закрыто покрытие каждого из 238 источников и добавленных подтверждений; пустые/служебные записи исключены с причиной, полезное объединено без потери смысла.
      - Реализована целевая структура Work/Programme/Configuration/Case/Media, общий набор RU/EN и непротиворечивая публичная проекция.
      - Все значимые старые входы/198 файловых URL имеют проверенный результат; новые отсрочки не подменяют выполненный перенос.
      - Пройдены QA расширенного кандидата и реальная проверка аналитики; показатели старого пакета не выдаются за новую проверку.
      - Владельцу показаны итоговые состав/структура; финальные самостоятельные проходы по слоям и M6 учитываются отдельно.
    depends_on:
      - SOURCE-COVERAGE-01
      - MIGRATION-QA-FULL-01
      - URL-MIGRATION-01
      - ANALYTICS-MIGRATION-01
    source: docs/MIGRATION-PLAN.md
    notes: Новую границу принял владелец 2026-10-07. Старые 95% сохранены отдельно; завершение этой задачи не является разрешением domain cutover, push/PR или изменением прав конкретного частного источника.

  - id: FORMATS-MIGRATION-01
    title: Перенести участие, результаты и технические условия трёх форматов
    area: content
    priority: P0
    status: done
    outcome: Три существующих Format имеют самостоятельное описание и параметрическую рамку проведения в RU/EN.
    acceptance:
      - Указаны механика, участие, результат, параметры, обязанности студии и площадки, темы и источники.
      - Архивные цифры отличаются от текущего предложения; конфликты таймингов и неизвестные условия явно отмечены.
      - Размер аудитории, одновременно измеряемые участники и пропускная способность различаются.
    notes: Перенос завершён по закреплённым источникам; финальная редактура после миграции, publication остаётся review.

  - id: COOPERATION-MIGRATION-01
    title: Объединить сотрудничество в четыре сценария и производственную рамку
    area: content
    priority: P0
    status: done
    outcome: Cooperation связывает институциональный, событийный, производственный и образовательный запрос с существующими Format.
    acceptance:
      - Перенесены три режима работы, распределение ответственности, процесс и состав брифа.
      - Адресные бюджеты, неподтверждённые регалии, гарантии и обещания срока ответа не публикуются как общие условия.
      - Сценарии имеют прямые якоря в RU/EN, старые ссылки сохраняют смысл назначения.
    notes: Источники и SHA-256 зафиксированы; детальная редактура и publication отделены от факта переноса.

