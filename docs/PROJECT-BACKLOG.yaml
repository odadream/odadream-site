items:
  - id: UX-UI-RELEASE-27
    title: Проверить UX, визуальную иерархию и адаптивную вёрстку
    area: design_system
    priority: P1
    status: done
    outcome: Подтверждённые проблемы общих компонентов исправлены и опубликованы.
    acceptance:
      - Реальные страницы и производственные образцы проверены в двух темах и на узкой, средней и широкой геометрии.
      - Исправления используют семантические роли и общие компоненты, сохраняют визуальную грамматику V5.
      - Проверены клавиатура, фокус, переносы, плотность, управление медиа и внешние отступы.
      - Зависимые проверки и итоговый release успешны, результат проверен на домене.
    source: Прямое поручение владельца 27.10.2026 найти и устранить проблемы UX/UI, эстетики и вёрстки, обновить сайт.
    reading: [docs/DESIGN-GUIDE.md, docs/DESIGN-TOKENS.md, docs/SITE-PRINCIPLES.md]
    notes: 'Исправлены четыре общих проблемы: контактный адрес наследует предусмотренную крупную роль; галерея сохраняет 2 колонки на 360/375 px; lightbox предлагает только дополнительный контекст; меню/оглавление/DEV-справка взаимно исключаются и освобождают клавиатурный фокус. Система и живые образцы синхронизированы. Опубликован b52793d, CI 40455741454: 155 unit, 211 E2E / 39 предусмотренных пропусков, все release gates успешны с первой попытки. Проверены 10 HTTPS страниц RU/EN, ресурсы и закрытые DEV-маршруты; в браузере подтверждены 2 колонки на 360 px, email 22 px / target 44 px и меню ArrowDown. Подробности UX-UI-AUDIT-2026-10-27.md и RELEASE-RUNBOOK.md. Авторская оценка дизайна отдельно.'

  - id: SEO-REVIEW-RELEASE-27
    title: Проверить индексацию, провести ревью и опубликовать исправления
    area: maintenance
    priority: P1
    status: done
    outcome: Подтверждённые дефекты индексации и кода устранены и доставлены на основной домен.
    acceptance:
      - Уведомление Google и реальные состояния адресов исследованы; ограничения доступа явно указаны.
      - Метаданные, sitemap, ответы сервера и выбранные runtime-компоненты проверены и исправлены по фактам.
      - Изменения закоммичены, release workflow успешен, опубликованные страницы проверены.
      - Ошибки проверяются точечно с сохранением полного baseline, без повторения успешных матриц.
    source: Прямое поручение владельца 27.10.2026 проверить Gmail, провести code review, исправить и публиковать до результата.
    notes: 'Письмо и Search Console проверены в аккаунте владельца: исключения старых адресов ожидаемы; 12 текущих страниц ожидают решения Google. Исправлены social image 16 страниц, сериализация JSON-LD, маршруты, индексы связей медиа, фокус и синхронизация DEV-черновиков, общая геометрия галерей. Astro 7.3.8, npm audit 0. Опубликован 2a4d6bc, CI 40415624142: 155 unit, 205 E2E / 39 ожидаемых пропусков, все release gates успешны с первой попытки. После доставки все 184 canonical URL проверены; sitemap повторно принят Google, запросы индексации признаний и страницы фестиваля Циолковского приняты. Подробности REVIEW-2026-10-27.md и RELEASE-RUNBOOK.md.'

  - id: MEDIA-CONTEXT-27
    title: Разделить описание кадра и контекст события
    area: design_system
    priority: P1
    status: done
    outcome: Подпись выбирает нужные метаданные по контексту галереи без повторов события.
    acceptance:
      - Описание кадра, alt, контекст и кредит имеют разные поля и назначение.
      - Внутри события показывается описание кадра, вне события сохраняется связь с событием.
      - Полные сведения доступны в просмотрщике, данные проходят публичную проекцию.
      - RU/EN и зависимые галереи проверены без повторения полной матрицы.
    source: Комментарий владельца 27.10.2026 о повторяющихся подписях фестиваля Циолковского.

    notes: 'Добавлено отдельное Media.description; alt, архивная caption, кредит и связь с CaseEvent не смешиваются. Обе галереи события получают contextEventId. Для восьми проверенных фото спектакля заполнены RU/EN описания; старые фотографии используют существующий описательный alt как совместимый fallback. Полная подпись и ID остаются в lightbox. Публичная проекция сохраняет новое поле. 15 зависимых unit, content check, design check и типы успешны. Прогон 1793052587521: 20 E2E успешны, два предусмотренных пропуска. После уточнения канонической связи media/presentationMedia три unit и финальный повтор 1793052711245 успешны; свежая сборка проверена. Полная матрица повторно не запускалась. Визуально проверена страница события; публикация не выполнялась.'

  - id: GALLERY-ROLLOUT-26
    title: Внедрить утверждённую галерею и композицию страниц работ
    area: design_system
    priority: P1
    status: done
    outcome: Производственные страницы используют общий образец медиа и единый визуальный рассказ.
    acceptance:
      - Все плиточные MediaGallery используют естественные пропорции, микроподписи, адаптивные колонки и общий просмотрщик.
      - Страницы работ начинают с hero и первой подборки, следующие медиа перемежаются пояснением; история показов обратная, источники компактны.
      - Документы сохраняют последовательность и полное поле; стена признаний сохраняет группировку и счётчики.
      - DEV-редактор галереи общий, черновики по ID и счётчик доступны на реальных страницах.
      - Стенд использует производственные компоненты; обе темы, RU/EN и разные ширины проверены.
    source: Поручение владельца 26.10.2026 распространить галереи и композицию страниц работ.

    notes: 'Общая MediaGallery внедрена на всех плиточных потребителях; стенд использует тот же компонент. Все 21 работы используют общий визуальный рассказ, галереи разделяют пояснение; отдельный сайт проекта сохраняет короткий вход. Документы и признания сохраняют своё назначение. Общий DEV-редактор заменяет прежний интерфейс профилей; пользовательские черновики v2 сохранены. Design check успешен. Полный baseline 1793050449477: 146 unit, контент, типы, сборка и 199 E2E успешны, 39 предусмотренных пропусков; два падения — устаревший подсчёт ссылок истории программы в desktop/mobile. После подавления ссылок на текущее событие прогон 1793052024785: 20 зависимых E2E успешны, два пропуска; те же два ожидания истории уточнены по фактическому блоку programme-conditions. Их финальный повтор 1793052195893 успешен, свежая сборка проверена. Светлая/тёмная темы, узкая/средняя/широкая геометрия и реальные потребители просмотрены. Публикация на домен не выполнялась; авторская оценка отдельно.'

  - id: DEV-FRAMING-HEIGHT-26
    title: Устранить конфликт высоты компактного превью и DEV-кадрирования
    area: design_system
    priority: P1
    status: done
    outcome: Явно выбранная рамка задаёт фактическую геометрию изображения без ограничения компактного документа.
    acceptance:
      - MindGrid в режиме contain сохраняет весь оригинал внутри рамки при широкой и узкой галерее.
      - Ограничение media-preview-height не влияет на явно применённые contain/cover.
      - После перезагрузки режим и фактическая геометрия сохраняются; исходный режим и lightbox не изменены.
    source: Замечание владельца 26.10.2026 о высоте MindGrid после настройки кадрирования.
    notes: 'У явно заданной contain/cover-рамки исключено влияние intrinsic-размеров и compact max-height. Проверены размеры рамки и изображения, вертикальный фокус, reload и natural reset. Прогон 1792989959090: 4 E2E успешны; design:check и design-contract успешны. Исходный режим документов сохраняет свой предел, lightbox использует оригинал. Изменение локальное.'

  - id: DEV-SERVICE-PANEL-23
    title: Понятная постоянная служебная панель сайта
    area: design_system
    priority: P1
    status: done
    outcome: Режимы просмотра, готовность PUBLIC и локальные правки объяснены в закреплённой панели.
    acceptance:
      - Панель находится внутри sticky-шапки, не исчезает при прокрутке и учитывается в якорях.
      - Переход к рабочей версии, PUBLIC и редактуре имеет понятное название и справку.
      - Отсутствие страницы в PUBLIC объясняется в справке вместе с фактической целью перехода.
      - Панели состояния и кадрирования доступны с клавиатуры и не занимают экран при закрытии.
    source: Поручение владельца 23.10.2026 переработать DEV-панель.
    notes: 'Панель внутри sticky-шапки, один/два ряда, понятные переходы и справка, локальные изменения и пересборка без смешения с публикацией. Прогон 1792988343791: 14 E2E успешны; после уточнения подписи действия повтор 1792988491147: 8 E2E успешны. 8 зависимых unit и design:check успешны. Светлая/тёмная темы и мобильная справка просмотрены; серверы DEV/PUBLIC запущены. Публикация на домен не выполнялась.'

  - id: GALLERY-STUDY-23
    title: Образец микроподписей и единого фокуса галереи
    area: design_system
    priority: P1
    status: done
    outcome: Живой образец для визуального согласования до внедрения на страницы.
    acceptance:
      - Реальные ID, типы и связи с событиями; дата события не подменяет дату создания.
      - Открытие по картинке без постоянного значка увеличения; DEV-кадрирование поверх изображения.
      - Единый фокус и режим вписывания с применением к превью разных пропорций.
      - 'Рекомендации UX применены только в образце: короткие названия, подпись 11 px, контейнерная сетка 2/3/4 и узкий режим 1.'
    source: Поручение владельца 23.10.2026 подготовить образец перед внедрением.
    notes: 'Образец готов на /design-system/#gallery-study. Прогон 1792784809970: 146 unit, типы, контент, сборка и 4 зависимых E2E успешны. После уплотнения панели повтор 1792784987264 успешен. Светлая/тёмная темы и ширины 390/797/1380 проверены. Рекомендации UX применены в образце: короткие подписи 13 px, ID в lightbox, контейнерная сетка 1/2/3/4. Повтор 1792785693928: 15 E2E успешны, 1 предусмотренный пропуск; типы и design:check успешны. По следующей правке владельца микротекст уплотнён: 11 px / 1.3, image/label gap 4 px, item gap 12 px, columns 8/12 px. Геометрические проверки и просмотрщик: 1792786105207, 13 E2E успешны, 1 предусмотренный пропуск; design:check и design-contract успешны. Следующие микроправки: baseline символа, CalloutLink inline, внешний ритм 16/16 px и совпадение боковых осей проверены прогоном 1792786665461 (desktop/mobile). По поручению владельца применение обновляет DEV-галерею и сохраняет черновик в браузере; счётчик и экспорт в DEV-шапке показывают ожидающие переноса ID. Проверка 1792787179017: 13 E2E успешны, 1 предусмотренный пропуск; проверены фактический fit плитки, восстановление после reload, счётчик уникальных ID и сброс. Перенос в исходные данные и PUBLIC не выполнялся.'

  - id: NARRATIVE-MEDIA-23
    title: Визуальные островки на страницах работ и событий
    area: design_system
    priority: P1
    status: done
    outcome: Медиа раскрывает работу до подробного текста, без повторов обложки.
    acceptance:
      - Первая подборка следует за hero, дополнительные материалы перемежаются текстом.
      - Компактная плитка сохраняет две колонки на телефоне; метаданные доступны в lightbox.
      - История показов использует обратную хронологию; одиночное авторство ODA не создаёт раздел.
      - Ссылки на уже показанные материалы не повторяются, настройки аналитики выровнены с копирайтом.
    source: Комментарии и поручение владельца 23.10.2026.
    notes: 'Общие шаблоны RU/EN и связанные компоненты обновлены. Full baseline 1792778727966 сохранён с прежними ожиданиями тестов; после исправлений зависимый прогон 1792780213547 успешен: 146 unit, 25 E2E, 7 предусмотренных пропусков. Финальное устранение повторной фотографии hero: прогон 1792780710699 успешен, 146 unit и 9 зависимых E2E, 1 предусмотренный пропуск. Публикация этого изменения не выполнялась.'

  - id: RELEASE-RECOGNITION-METHOD-23
    title: Опубликовать архив признаний и описание технологии
    area: release
    priority: P1
    status: done
    outcome: Обновления признаний и технологии доступны на odadream.art.
    acceptance:
      - Полный baseline сохранён; исправленные тесты и зависимости проходят короткий повтор без изменения production-артефакта.
      - Права, аналитика и отсутствие приватных оригиналов проверены.
      - HTTPS-страницы, файлы и просмотрщик проверены после доставки; сохранены резервная копия и путь восстановления.
    notes: 'Опубликован a8d5a93, workflow 39954583637. 146 unit и 68 E2E успешны, 2 предусмотренных пропуска. SHA совпадает с baseline 39951872143. После доставки прошли 15 HTTPS-проверок и перелистывание галереи MindDB.'
    source: Прямое поручение владельца 23.10.2026 завершить проверки и опубликовать все изменения.

  - id: LAUNCH-TEASER-V2-23
    title: Подготовить вертикальный тизер V2 с музыкой
    area: content
    priority: P2
    status: done
    outcome: Готов MP4 для анонса сайта в социальных сетях.
    acceptance:
      - Реальные экраны сайта и материалы ODA, вертикальный формат 1080×1920.
      - Музыка с зафиксированным источником и кредитом, текст анонса и обложка.
      - Композиция, декодированные кадры, длительность и звуковая дорожка проверены.
    notes: '38,4 секунды, H.264/AAC, 30 fps. HyperFrames-проект в локальной папке Videos/ODA-V2-launch; выдача в игнорируемой output/launch-v2. По выбору владельца после OAuth музыка заменена треком библиотеки HeyGen c73f9aeaa16a49ba8e5ecb320bb8c6b7; предыдущая версия сохранена. Социальные публикации не выполнялись.'
    source: Запрос владельца 23.10.2026 на тизер-обзор сайта с музыкой для анонса V2.

  - id: METHOD-TECHNOLOGY-02
    title: Пояснить построение и чтение нейромандалы
    area: content
    priority: P1
    status: done
    outcome: Читатель понимает ритмы, мощность, время и радиус, видит реальные примеры без раскрытия реализации.
    acceptance:
      - RU/EN объясняют четыре ритма, относительную мощность и чтение кругового графика.
      - Фотография демонстрации, три анонимных кадра MindDB и два рисунка заявки используют общий MediaGallery/MediaViewer.
      - Нет формул, схем обработки, персональных данных и диагностических интерпретаций.
      - Источники и SHA зарегистрированы, сырой архив не входит в публичную сборку.
    source: Запрос владельца 23.10.2026; Obsidian, статья Дзена, материалы заявки NeuromandalaMath и MindDB.
    reading: [docs/SITE-PRINCIPLES.md, docs/CONTENT-AND-CMS.md, docs/DESIGN-GUIDE.md]

  - id: RECOGNITION-CREDIT-GROUPING-01
    title: Группировать документы одного кредита признания
    area: content
    priority: P1
    status: done
    outcome: Несколько писем или сопутствующих подтверждений одной формы участия образуют одну запись, а отдельные документы открываются страницами общего просмотрщика.
    acceptance:
      - Один и тот же кредит не дублируется в счётчиках и списке признаний.
      - Каждое письмо/подтверждение показано отдельной миниатюрой и доступно страницей в lightbox.
      - Разные формы признания на одном событии остаются отдельными кредитами.
      - Источники проверяются по SHA, частные пути не попадают в PUBLIC.
      - RecognitionWall, карточка архива, дизайн-гайд, статистика и тесты описывают одну модель.
      - Статистика признаний показывает общий итог и раскрываемую разбивку по типам.
      - Избранное заполняет полные адаптивные ряды, максимум четыре; архив сохраняет весь каталог.
      - 'Подпись общая для стены и архива: год, краткое событие/организация, подтверждённое место; исправлена экспозиция фотографии Сколково без изменения оригинала.'
    source: Решение владельца 2026-10-23 о группировке адресных писем и подтверждающих документов одного события и формы признания.
