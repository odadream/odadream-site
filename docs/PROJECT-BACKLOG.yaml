    outcome: Каждый старый ID и значимый публичный ресурс имеет проверенный целевой маршрут или осознанное архивное решение.
    acceptance:
      - Аудит охватывает PDF, видео и пути вне images/content; все 198 содержательных исторических URL имеют проверенное сохранение или согласованное архивное решение.
      - Все 238 ID классифицированы, fallback не выдаётся за завершённый перенос статьи.
      - Учтены ссылки из отправленных PDF, писем и досье; значимый outreach-вход получает точное или объяснимое назначение.
      - Проверены lang, internal=true, aliases, парные маршруты и HTTP-статусы файлов.
      - Определена необходимость HTTP redirect-слоя, клиентский переход не называется 301.
    depends_on: [MIGRATION-PLAN-01]
    notes: Проверены все 238 ID для dev и public. Дополнительно подготовлены 15 оригиналов Work; кандидат содержит 28 точных исторических ресурсов с разрешёнными правами. Все 11 PDF разобраны (55 страниц, 12 аннотаций); два личных QR декодированы без подтверждения текущих внешних аккаунтов. Inventory содержит очередь предложений для всех 198 содержательных URL. M4 не завершён, retirement и HTTP-redirect не согласованы.

  - id: LEGACY-COMPATIBILITY-CORE-01
    title: Сохранить контекст старых входов и точные адреса выбранных превью
    area: migration
    priority: P0
    status: done
    outcome: Все 238 ID проверяются в обеих языковых версиях, четыре дополнительных старых адреса изображений связаны с выбранными Media без обхода публикационной выборки.
    acceptance:
      - Известная неперенесённая запись сохраняет ID/lang, internal=true не открывает закрытую запись.
      - Старые пути изображений побайтно совпадают с источником и проверяются SHA-256.
      - Draft/review и restricted не публикуют дополнительные ресурсы; план preserve без файла не снимает release gate.
      - Ошибка загрузки manifest и некорректный якорь приводят к безопасному fallback.
    depends_on: [MEDIA-AUDIT-FULL-01, PUBLICATION-SCOPE-01]

  - id: ANALYTICS-MIGRATION-01
    title: Перенести измеримость действий посетителя в V2
    area: analytics
    priority: P0
    status: in_progress
    outcome: Согласованные page_view и контактные/медиа-действия измеряются с корректным согласием и без дублей.
    acceptance:
      - Зафиксированы необходимые события и конфигурация провайдеров без публикации секретов.
      - Старый ID-переход не создаёт двойную конверсию.
      - Сохраняются Work/Format, язык и материал без данных адресатов; email-клик считается намерением, а не состоявшейся заявкой.
      - Наблюдение событий проверено на тестовом окружении до переключения домена.
    depends_on: [MIGRATION-PLAN-01]
    notes: Общий runtime и mock-адаптеры готовы (ANALYTICS-CORE-01). ID найдены и подготовлены локально; отключение автоматических событий в кабинетах и реальное наблюдение до переключения ещё не проверены; конфигурация по умолчанию disabled.

  - id: MIGRATION-CONTENT-01
    title: Уточнить полезный объём и способы преобразования корпуса V1
    area: migration
    priority: P0
    status: done
    outcome: Все 238 записей получили содержательную роль и способ преобразования в editorialReview, MIGRATION-PLAN.md уточняет план.
    acceptance:
      - Явные заглушки, служебные ветки и пустая навигация отделены от полезных текстов и структурных фактов.
      - Длина текста не служит критерием исключения галерей, доказательств и событий.
      - Число исходников не объявляется количеством обязательных новых страниц, повторы объединяются под задачи V2.
      - Первое исполнение ограничено проверкой ядра и выбранным смысловым пакетом вместо копирования 1к1.
    depends_on: [MIGRATION-PLAN-01]
    notes: Факты и авторство в отобранном пакете проверяются отдельно, рекомендации о приоритетах не являются утверждённым художественным ранжированием.

  - id: REFACTOR-V2-01
    title: Устранить дублирование правил каталога и документации
    area: architecture
    priority: P1
    status: done
    outcome: Общие выборки каталога и загрузчик данных для проверок; ожидаемые пути сборки берутся из реестра маршрутов.
    acceptance:
      - Реализация определяется stage, дублирующего realized в Work нет.
      - Главная и статистика используют общие выборки, доступность остаётся самостоятельным полем.
      - Описание миграции ограничено MIGRATION-PLAN.md и migration/INVENTORY-2026-10-05.json.
      - Принятые решения владельца находятся в CONTENT-AND-CMS.md, контракт карточки в DESIGN-GUIDE.md.
    notes: Проверены форматирование, 10 unit-тестов, content-check, Astro check, build и 40 браузерных тестов (4 дублирующие проверки пропущены). Согласование миграции остаётся отдельным шагом; release gate сохраняет ожидаемые блокировки.

  - id: PUBLICATION-SCOPE-01
    title: Общая публичная выборка для рендеринга и release gate
    area: architecture
    priority: P0
    status: done
    outcome: Отложенные записи не блокируют выпуск выбранного пакета и не попадают в публичные routes, HTML, JSON или assets.
    acceptance:
      - Render, routes/sitemap, статистика и release gate используют одну публикационную выборку с её зависимостями.
      - Скрытые hero и отложенные Recognition/MindDB aggregate не блокируют выпуск; их карточки, блоки и закрытые assets отсутствуют в публичном результате.
      - Для включённых материалов сохраняются проверки фактов, разрешений, приватности и целостности связей; фильтрация не подменяет решения по историческим URL.
      - Проверены два сценария на fixtures: review запись вне публичного пакета не блокирует выпуск; включённая запись с нерешённой приватностью/разрешением блокирует.
    source: docs/MIGRATION-PLAN.md
    notes: Реализовано 2026-10-06. Версионный publication-plan задаёт выбранные ID, scope проверяет статусы и зависимости; dev остаётся редакционным предпросмотром, build исключает отложенные routes/HTML/assets. Старые URL разрешаются через отдельный resolver; их решения и редакционные статусы не подменены. Проверены 19 unit-тестов, 42 браузерных теста (6 дублирующих пропущены), Astro и сборка. Проверки двух сценариев выполнены на fixtures, фактические routes/файлы и legacy переходы проверены в браузере.


  - id: MIGRATION-ACCEPTANCE-01
    title: Сценарная и визуальная приёмка выбранного выпуска V2
    area: migration
    priority: P0
    status: planned
    outcome: Выбранный публичный пакет закрывает типовые обращения и понятен при прямом входе и пересылке.
    acceptance:
      - Work/Format/Cooperation/Studio отвечают на типовые вопросы кураторского, агентского, производственного и образовательного обращения.
      - Нейромандала объясняет метод и визуальный язык самостоятельно; согласованы условия трёх текущих форматов и сценарии Cooperation.
      - Существующие биографии/CV, технический обзор, программа лаборатории и выбранные доказательства актуальны; требуемые документы имеют дату и подходящий объём.
      - При прямом входе, пересылке и на мобильном в RU/EN доступны объяснение, подтверждение и следующий шаг; неизвестные параметры не выдуманы.
      - Адресные концепции, адаптации, цены и бюджеты не выдаются за готовые или согласованные общие предложения и не блокируют выпуск общего сайта.
      - Визуальные уточнения проходят общие компоненты, токены и стенд V5/V2; проверены участие человека, подписи примеров, карточки и паспорта.
      - Выпуск проходит технические проверки, общий publication gate и решения по историческим URL; расширение каталога не имеет обязательного количества.
    depends_on: [PUBLICATION-SCOPE-01, URL-MIGRATION-01, ANALYTICS-MIGRATION-01]
    source: docs/MIGRATION-PLAN.md
    notes: Детальная редакционная и визуальная приёмка владельцем выполняется после завершения согласованной миграции; на промежуточных этапах он проверяет структуру. Вводы по конкретным адресатам основаны на датированном отчёте outreach-агента. Их текущие статусы проверяются в переписке при исполнении; второй CRM или публичные страницы адресатов не создаются.


  - id: MIGRATION-COMPLETE-01
    title: Завершить согласованный объём миграции до отдельных проходов по слоям
    area: migration
    priority: P0
    status: in_progress
    outcome: Выбранный пакет V2 перенесён и технически проверен, завершённое и отложенное явно учтено.
    acceptance:
      - Определён состав пакета, сущности и смысловые модули перенесены с источниками, медиа, связями и RU/EN.
      - Для исходников вне объёма зафиксировано объединение, откладывание или исключение; неизвестные значения явно отмечены.
      - Для старых входов и ресурсов есть проверяемое поведение и решения, нерешённые согласования не выдаются за завершённые.
      - Проходят необходимые структурные, типовые, сборочные и браузерные проверки; явные поломки и утечки устранены.
      - Владельцу показаны итоговая структура и состав; подробный дизайн, общая и постраничная редактура и проход движка идут отдельными задачами после миграции.
    depends_on: [MIGRATION-PLAN-01, PUBLICATION-SCOPE-01]
    source: docs/MIGRATION-PLAN.md
    notes: Порядок прямо задан владельцем 2026-10-06. Отсутствие промежуточного чтения контента не блокирует перенос. Завершение миграции не разрешает переключение домена и не автоматически меняет publication или права.


  - id: FORMATS-MIGRATION-01
    title: Перенести участие, результаты и технические условия трёх форматов
    area: content
    priority: P0
    status: done
    outcome: Три существующих Format имеют самостоятельное описание и параметрическую рамку проведения в RU/EN.
    acceptance:
      - Указаны механика, участие, результат, параметры, обязанности студии и площадки, темы и источники.
      - Архивные цифры отличаются от текущего предложения; конфликты таймингов и неизвестные условия явно отмечены.
      - Размер аудитории, одновременно измеряемые участники и пропускная способность различаются.
    notes: Перенос завершён по закреплённым источникам; финальная редактура после миграции, publication остаётся review.

  - id: COOPERATION-MIGRATION-01
    title: Объединить сотрудничество в четыре сценария и производственную рамку
    area: content
    priority: P0
    status: done
    outcome: Cooperation связывает институциональный, событийный, производственный и образовательный запрос с существующими Format.
    acceptance:
      - Перенесены три режима работы, распределение ответственности, процесс и состав брифа.
      - Адресные бюджеты, неподтверждённые регалии, гарантии и обещания срока ответа не публикуются как общие условия.
      - Сценарии имеют прямые якоря в RU/EN, старые ссылки сохраняют смысл назначения.
    notes: Источники и SHA-256 зафиксированы; детальная редактура и publication отделены от факта переноса.

