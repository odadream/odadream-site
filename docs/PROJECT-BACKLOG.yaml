    outcome: Видео ведёт себя как pause/resume до перезагрузки страницы.
    acceptance:
      - После первой загрузки неподвижный первый кадр; desktop hover/keyboard focus и центр touch-экрана
        активируют видео. При выходе видео ставится на паузу, последний кадр остаётся видимым без замены
        постером.
      - Повторная активация продолжает currentTime до reload; состояние привязано к медиа/представлению,
        повторный mount и пересчёт viewport не сбрасывают позицию. Позиции не требуют cookie/localStorage.
      - "Один общий механизм для hero, карточек и галерей: одно активное превью, скрытая вкладка/просмотрщик
        останавливают фон; reduced-motion/Save-Data оставляют неподвижное представление. В hero завершение
        передаётся очереди, не теряется в бесконечном loop."
    depends_on:
      - VIDEO-PREVIEW-01
    source: "Авторская обратная связь 2026-10-12: главная RU, desktop; docs/SITE-PRINCIPLES.md"
    notes: "12.10: единый контроллер сохраняет декодированный кадр/source/currentTime, один активный ролик и ограничения движения. Hover/focus/touch, late play, скрытая вкладка и Save-Data/reduced-motion проверены."

  - id: SITE-STATS-02
    title: Считать работы, состоявшиеся события и признания по своим категориям
    area: content_model
    priority: P1
    status: done
    scope: global_data
    request_kind: approved_change
    outcome: Счётчики автоматически отражают тот же публичный корпус, что и представления.
    acceptance:
      - "Работы: всего в каталоге и раскрываемая разбивка реализовано/прототип/концепция, включая нулевые
        категории. R&D и доступность заказа не подменяют стадию; общий источник используется на главной и других
        страницах."
      - События в каталоге в публичном счётчике означают только состоявшиеся события. Приглашения, планы,
        поданные/отклонённые заявки и несостоявшийся показ не увеличивают число и не показываются как
        состоявшаяся связь Work–Event; исходные данные не удаляются.
      - Ввести категорию события (фестиваль, конференция, форум, выставка, школа и т.п.) отдельно от роли
        студии/формы продукта. Зафиксировать единицу счёта, дедупликацию нескольких участий в одном событии,
        неизвестную категорию и даты; раскрываемые категории вычисляются автоматически.
      - "Признания: всего и по фактическим RecognitionKind в боковой статистике, источник — опубликованные
        типизированные записи. Архивный старый перечень и папки Golem не смешиваются с этими числами; DEV/PUBLIC
        считаются из соответствующей проекции."
    depends_on:
      - DESIGN-UX-ROLLOUT-01
    source: "Авторская обратная связь 2026-10-12: главная RU, desktop; docs/SITE-PRINCIPLES.md"
    progress: "Закрыто 2026-10-12: общие расчёты из DEV/PUBLIC-проекции; Work — общее число и все стадии с нулями; Event — только held, дедупликация по event.id, категории отдельно от CaseEvent.type; Recognition — реальные виды. Текущий PUBLIC: 23 Work, 34 состоявшихся событий, 17 Recognition. Архивные перечни исключены из паспортов. Общие варианты и стенд синхронизированы; 97 unit, браузерная матрица и итоговые проверки прошли."

  - id: HOME-EVENTS-02
    title: Расширить главную хронологию с 2019 года и начинать с события
    area: design_system
    priority: P1
    status: done
    scope: home
    request_kind: approved_change
    outcome: Хронология показывает историю участия по годам и раскрывает контекст каждого события.
    acceptance:
      - Подборка включает минимум одно подтверждённое состоявшееся событие каждого года с 2019 до текущего.
        Недостающие годы исследуются в источниках Golem/Obsidian; отсутствие записи не заменяется выдуманным
        событием.
      - "Порядок полей: год, полное название события с жанром, город, площадка, показанная Work/Programme.
        Название работы не подменяет фестиваль/конференцию/форум/летнюю школу; связанные продукты и подробности
        доступны по ссылке."
      - Используются общий Case/Event-ряд и канонические связи; таблица/ритм заполняют блок естественно, без
        искусственной высоты. Счётчики H.03 соответствуют SITE-STATS-02; несостоявшиеся события в подборку не
        входят.
    depends_on:
      - SITE-STATS-02
    source: "Авторская обратная связь 2026-10-12: главная RU, desktop; docs/SITE-PRINCIPLES.md"
    notes: Источник 2021 найден в Obsidian; точные даты и неизвестные места сохраняются по источникам.
    progress: "Закрыто 2026-10-12: общий CaseRow overview, 12 строк за 2019–2026. Добавлена «Октава», Тула, 12.04.2021 по SHA-снимку первичного Obsidian-источника; новое событие включено в реестр текстов. Для 2023 сохранено «С 2023» повторяющихся практик. Даты отчётов не участвуют в отборе по годам. Название события/жанр, известные город/площадка, описание и ссылки отделены от названия работы. RU/EN, темы, мобильные/десктопные ширины проверены; неизвестные площадки не выдумываются."

  - id: DESIGN-RECOGNITION-SUMMARY-02
    title: Показывать достижения первыми и сократить карточку признания
    area: design_system
    priority: P1
    status: done
    scope: global
    request_kind: approved_change
    outcome: Обзорная карточка кратко сообщает вид признания и за что оно получено.
    acceptance:
      - Награды и достижения стоят перед дипломами и благодарностями по смыслу RecognitionKind; участие/отбор не
        переименовываются в победу. Внутри группы действует последовательное правило даты.
      - "Компактный общий вариант: скан/явное отсутствие, дата, тип, заголовок и краткое пояснение за что;
        ссылка Контекст участия сохраняется. Адресат, подробности события и примечания отсутствуют в карточке
        главной, но сохраняются в источнике и при необходимости подробном представлении."
      - Боковая статистика по видам наград/признаний из SITE-STATS-02. Компактный вариант описан в
        дизайн-системе и отличается функцией, а не стилем по ID страницы; проверены длинные заголовки, RU/EN и
        целые сканы.
    depends_on:
      - SITE-STATS-02
    source: "Авторская обратная связь 2026-10-12: главная RU, desktop; docs/SITE-PRINCIPLES.md"
    progress: "Закрыто 2026-10-12: общий overview-вариант RecognitionCard, 7 карточек на главной. Порядок award → grant → selection → certificate → acknowledgement-letter, новые годы первыми внутри вида. Краткий overviewClaim, полный скан либо явное отсутствие, контекст/переход в архив; адресат и подробные примечания остаются в catalogue-варианте. CYENS сохраняет резерв и итог невключения. Реальная статистика по видам, длинные заголовки и целые сканы проверены в RU/EN и обеих темах; авторская приёмка отдельно."

  - id: HOME-METHOD-DIAGRAM-02
    title: Показать круг коллективной биологической обратной связи в H.02
    area: design_system
    priority: P1
    status: done
    scope: home
    request_kind: design_prototype
    outcome: Минималистичная схема объясняет группу, измерение, вычисление и возвращение опыта.
    acceptance:
      - "Круговая инфографика: 2+ человека → ЭЭГ/ФПГ/движение и другие измерения последовательно или
        одновременно → вычислительная система → визуальное/аудиальное представление → обратно к группе.
        Предпочтительно SVG и общий переиспользуемый компонент."
      - "Существующие Сигнал/Перевод/Опыт становятся подписями связей, если соответствуют схеме. Слова для
        процессов подбираются в образце: рефлексия, ощущение тела/окружения, взаимовосприятие;
        интероцепция/экстероцепция/эмпатия — кандидаты для редакционной оценки, не обещанный измеряемый
        результат."
      - Показать desktop и мобильный вариант с читаемыми стрелками/подписями и текстовым эквивалентом. Диаграмма
        описывает художественный метод, не имитирует данные сенсоров; нет обязательной анимации или случайных
        физиологических чисел.
    depends_on:
      - DESIGN-UX-MACRO-01
    source: "Авторская обратная связь 2026-10-12: главная RU, desktop; docs/SITE-PRINCIPLES.md"
    progress: "Образец готов 2026-10-12: общий CollectiveFeedback SVG на главной и стенде; группа 2+, последовательное/одновременное измерение, ЭЭГ/ФПГ/движение, вычисление, изображение/звук/движение и возврат опыта. Сигнал/Данные/Перевод/Опыт подписывают связи; ощущение себя/окружения/взаимодействий описано без обещания измеряемой эмпатии. Есть HTML-эквивалент и доступное описание SVG. RU/EN, обе темы, 360/390/701/1440 px и type-scale 1.125 проверены. Формулировки и образец ждут авторской оценки; не объявлены принятой редактурой."

  - id: DEV-MEDIA-CROP-02
    title: Подготовить DEV-инструмент настройки композиции изображения
    area: editorial_tooling
    priority: P1
    status: done
    scope: global_dev
    request_kind: design_prototype
    outcome: Автор может увидеть и сохранить композицию под разные представления медиа.
    acceptance:
      - В DEV у материала доступен виджет с исходным изображением, важной областью/точкой и кадром выбранного
        представления (карточка, hero, галерейная обрезка); desktop/mobile рамки доступны для сравнения.
      - Композиция хранится как нормализованные данные Media/профиля представления, а не CSS по странице.
        Прототип позволяет проверить focal point против явной области кадрирования; формат сохранения/экспорта
        закрепляется до массового применения.
      - Настройки не теряются при resize, обложки занимают размер карточки с учётом содержимого. Документы/схемы
        остаются целыми; не вводить автоматический анализ лица/композиции как обязательный механизм.
      - Виджет, служебные данные и endpoint отсутствуют в PUBLIC; действия мышью и клавиатурой, сохранение и
        просмотр результата проверены. Права/подпись/связь оригинала не меняются от кадрирования.
    depends_on:
      - DEV-WORKSPACE-RECOVERY-02
      - MEDIA-GALLERY-01
    source: "Авторская обратная связь 2026-10-12: главная RU, desktop; docs/SITE-PRINCIPLES.md"
    progress: "Образец готов 2026-10-12: общий DEV-виджет для обложек, hero и MediaFigure. Полный исходный кадр сайта, точка/область, сравнение desktop/mobile для card/hero/gallery, нормализованный CompositionDraft v1. Черновики хранятся в DEV localStorage и экспортируются JSON; исходники не записываются, endpoint не создаётся, PUBLIC не меняется. Точка оценивается на DEV-обложках, область — в сравнительных рамках; перенос выбранного JSON в публикационные профили и массовое применение остаются после авторского выбора. Документы/схемы/афиши/screenshot защищены. Сохранение, resize/reload, экспорт, клавиатура, граница PUBLIC проверены; несохранённые изменения отмечены, галерейное управление не перекрывает реквизиты."

  - id: HOME-IDENTITY-02
    title: Исправить H / Главная и убрать бессодержательную подпись карточки
    area: design_system
    priority: P2
    status: done
    scope: home
    request_kind: approved_change
    outcome: Главная названа Главной, а пояснения медиа сообщают нужный смысл.
    acceptance:
      - Над hero H / ГЛАВНАЯ и H / HOME вместо названия метода; существующие h1 и вступление не переписываются.
      - На главной убран общий Кадр интерфейса у изображения MindShow. Shared WorkCard получает семантический
        режим представления; важные отличия прототипа/визуализации/документа не скрываются автоматически вместе
        с этой подписью.
      - Название Work и переход к её странице сохранены, лишний пустой трек подписи не остаётся; обе темы, RU/EN
        и карточки без специальных медиа-пояснений проверены.
    depends_on:
      - DESIGN-CARDS-01
    source: "Авторская обратная связь 2026-10-12: главная RU, desktop; docs/SITE-PRINCIPLES.md"
    notes: "12.10: H / ГЛАВНАЯ и HOME; WorkCard presentation=overview скрывает только общее screenshot-пояснение на главной. В каталоге пояснение сохранено, h1/вступление не переписаны."

  - id: DESIGN-COLOPHON-CONTENT-02
    title: Выбрать полезные выходные данные и оценить агрегат посещений
    area: design_system
    priority: P2
    status: planned
    scope: global
    request_kind: proposal
    outcome: Состав выходных данных обоснован пользой посетителю; вариант выносится на оценку.
    acceptance:
      - Предложить краткий состав вместо версии движка и неоднозначного Предыдущее посещение · это устройство.
        Astro может остаться в DEV; дата содержания и копирование адреса сохраняются. Удаление/замена спорных
        полей пока не считаются утверждёнными.
      - Текущая отметка посещения — localStorage конкретного браузерного профиля и sessionStorage текущей
        сессии, не cookie, не идентификация устройства и не выгрузка Метрики; это объясняется при сравнении
        вариантов.
      - Если предлагается статистика, сначала определить провайдера, сессии/пользователи/просмотры, период и
        охват сайт/страница, источник и дату снимка. Не суммировать GA и Метрику как независимые посещения.
      - Подготовить вариант с серверной/служебной выгрузкой и кэшем; API-токены/персональные данные не попадают
        в клиент. Нет выдуманных цифр, запроса к API при каждом открытии страницы и учёта локального QA как
        публичной аудитории.
    depends_on:
      - ANALYTICS-MIGRATION-01
      - DESIGN-COLOPHON-GEOMETRY-02
    source: "Авторская обратная связь 2026-10-12: главная RU, desktop; docs/SITE-PRINCIPLES.md"

