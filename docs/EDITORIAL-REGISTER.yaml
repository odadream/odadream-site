  - {"id":"shared:src/components/PageView.astro","kind":"shared-copy","file":"src/components/PageView.astro","ru":{"status":"edited","coverage_complete":true,"blocks":[{"id":"home-intro","title":"Главная · вступление","fields":["PageView.home.h1.ru","PageView.home.intro.ru"],"review_url":"/ru/#home-intro","status":"accepted","question":null,"owner_decision":"2026-10-10: «Давай пока оставим так». Сохраняем исходное публичное вступление; последующая редактура корпуса разрешена самостоятельно.","applied_commit":null,"audit_ids":["EA-18","EA-28"],"feedback":"2026-10-10, голосовой отклик владельца: первыми называем перформансы; состояние одного человека и взаимодействие людей — художественный материал; цифровые/материальные арт-объекты часто становятся результатом перформанса; инсталляция — форма их представления; спектакль — форма перформанса. Исходный вариант требует доработки.\n2026-10-10, уточнение владельца: предыдущее сообщение объясняло смысл, не задавало публичную формулировку. Нужны художественное и коммерческое представления. Заголовок должен ясно классифицировать студию: кто мы, поле деятельности и что делаем. Предыдущий вариант не принят.\n2026-10-10: владелец отклонил вариант «студия перформанса и медиаискусства» и поручил подобрать заголовок/вступление по источникам Golem Data Base.\n2026-10-10: владелец разрешил самостоятельную редактуру всего корпуса с последующей проверкой по необходимости. Последний вариант вступления не применяется.","research_summary":"По реестру источников GDB найден первичный vault Obsidian Chudodeystvo. Основное основание классификации — бриф Ребрендинг (приоритет художественного дуэта и современного искусства), авторский раздел «Мой комментарий» в Манифесте (neuroscience art; сознание, свобода воли, самость), Презентация ODA.Dream (красота внутреннего мира/коммуникации и человечность технологий). УТП v3 и художественная презентация v4 поддерживают соавторство и переход перформанса в артефакт. Старое украшенческое позиционирование рассмотрено как история. Смешанные авторские/ИИ-черновики не приняты целиком за канон; обещания объективного чтения эмоций, гарантированной эмпатии, благополучия и «слепка сознания» не перенесены в публичный вариант.","editorial_sources":[{"path":"D:/Obsidian/Chudodeystvo/ODA.dream/Ребрендинг.md","sha256":"800737897de60fa424e37f63fee8c2a7d3d31a78633aa3cd55a8533ad4c5018d","basis":"Художественный дуэт; современное искусство, science-art; три направления","read_at":"2026-10-10","role":"editorial-source-not-public-copy"},{"path":"D:/Obsidian/Chudodeystvo/ODA.dream/Представления ODA.Dream/Манифест и философия.md","sha256":"8ba0e71561ef7bb4e08fe5846604ba4d122041953ee135034f548e0acd790fff","basis":"Авторский комментарий: neuroscience art как исследование сознания/самости","read_at":"2026-10-10","role":"editorial-source-not-public-copy"},{"path":"D:/Obsidian/Chudodeystvo/ODA.dream/Презентация ODA.Dream.md","sha256":"2d2f141f0bbaca67b30cf32f3bd66b1fb6f35212cf37963d531426de3cbc3aa1","basis":"Авторские тезисы: внутренний мир, коммуникация, человечность технологий","read_at":"2026-10-10","role":"editorial-source-not-public-copy"},{"path":"D:/Obsidian/Chudodeystvo/Продукты и услуги/Программа ODA v3 - УТП-манифест.md","sha256":"c7ada67efa5a63c6d396f777d46898beea70eca0ebb50c1dd489be651287610c","basis":"Соавторство, диалог человека/технологии/художника; артефакт","read_at":"2026-10-10","role":"editorial-source-not-public-copy"},{"path":"D:/Obsidian/Chudodeystvo/ODA.dream/Программа ODA v4 - Худ. презентация.md","sha256":"947dad1c3cc6a1f1cd855b6a9106ecd72b6f1d51e94db577ba9f8447c76ab995","basis":"Перформанс и художественный результат","read_at":"2026-10-10","role":"editorial-source-not-public-copy"},{"path":"D:/Obsidian/Chudodeystvo/ODA.dream/Представления ODA.Dream/Профиль для выставок.md","sha256":"b58197a26211bc10117083129d9a994e4894701c39d83844c95cfb79ab130384","basis":"Самопредставление художественного дуэта","read_at":"2026-10-10","role":"editorial-source-not-public-copy"}]}],"checked_at":"2026-10-10","pass_id":"autonomous-copy-2026-10-10"},"en":{"status":"edited","coverage_complete":true,"checked_at":"2026-10-10","pass_id":"autonomous-copy-2026-10-10"},"baseline_file_sha256":"0e9bdd7b9c8f439a82a9ee7a3bdb97739dba7882e6ace97aff87adeef91f64bd"}
