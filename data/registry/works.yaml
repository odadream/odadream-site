# ODA.dream hub-works hub-registry — single source of truth for the catalog.
#
# Positioning: we are artists. Every product/service falls into ONE of three categories:
#   art        — Художественные работы (performances, installations, spectacles, hub-games, hub-materia)
#   education  — Просветительская деятельность (hub-lectures, hub-practices, demonstrations, measurements)
#   tech       — Технологические разработки (Neuromandala platform, hyperscanning — where patents live)
#
# status: production | rnd | concept | patent
# node:        id of the src/content/*.md page this work renders on (provenance is injected there)
# format_keys: values of `format` in engagements.yaml that belong to this work (drives auto-provenance)
# funnel:      hub-collab page a producer should be routed to from this work
#
# Canonical anchor (Chudodeystvo "Продукты и услуги"): Перформанс, Игры, Инсталляция,
# Ювелирка, MindShow, Bio-IMAG → art · Лекции/МК/Лабы, Практики, Нейро-замеры → education ·
# Нейромандала (система) → tech.

