<!doctype html>
<html lang="en">
  <head>
    <!-- Base -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- Primary Meta -->
    <title>ODA.dream | Art, Science &amp; Technology</title>
    <meta name="title" content="ODA.dream | Art, Science &amp; Technology" />
    <meta
      name="description"
      content="ODA.dream is an artist duo working across art, science, and technology through participatory performance, media art, neurotechnology, EEG, and computer vision."
    />
    <meta
      name="keywords"
      content="art science, participatory performance, media art, neurotechnology, neurophysiology, EEG hyperscanning, computer vision, ODA.dream"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#050505" />

    <!-- Canonical -->
    <link rel="canonical" href="https://odadream.art/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://odadream.art/" />
    <meta property="og:title" content="ODA.dream | Art, Science &amp; Technology" />
    <meta
      property="og:description"
      content="An artist duo working across art, science, and technology through participatory performance, media art, neurotechnology, EEG, and computer vision."
    />
    <meta
      property="og:image"
      content="https://odadream.art/images/assets/oda_preview.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:site_name" content="ODA.dream" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://odadream.art/" />
    <meta name="twitter:title" content="ODA.dream | Art, Science &amp; Technology" />
    <meta
      name="twitter:description"
      content="An artist duo working across art, science, and technology through participatory performance, media art, neurotechnology, EEG, and computer vision."
    />
    <meta
      name="twitter:image"
      content="https://odadream.art/images/assets/oda_preview.png"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["Organization", "PerformingGroup"],
        "name": "ODA.dream",
        "url": "https://odadream.art/",
        "logo": "https://odadream.art/images/assets/oda_preview.png",
        "description": "Artist duo working across art, science, and technology through participatory performance, media art, neurotechnology, EEG, and computer vision.",
        "email": "hi@odadream.art",
        "founder": [
          { "@type": "Person", "name": "Olga Arabova" },
          { "@type": "Person", "name": "Daler Arabov" }
        ],
        "knowsAbout": [
          "Art–science",
          "Participatory performance",
          "Media art",
          "Neurotechnology",
          "Neurophysiology",
          "EEG hyperscanning",
          "Computer vision"
        ],
        "sameAs": ["https://www.instagram.com/odadream/"]
      }
    </script>

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;300;400;500;700&subset=latin,cyrillic&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/assets/oda_favicon.svg"
    />

    <!-- Styles -->
    <link rel="stylesheet" href="/index.css" />
  </head>

  <body>
    <div class="bg-noise"></div>
    <div id="root"></div>

    <!-- App entry -->
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
